oral:
  - q: What is stochastic bias in phylogenetics?
    a: >
      Random noise introduced by limited data that can overwhelm the true
      phylogenetic signal — even when the model used is correct.

  - q: What are three causes of stochastic bias?
    a: >
      (1) Insufficient sequence length or number of genes. (2) Low
      phylogenetic signal — few informative sites. (3) High variance
      in the substitution process.

  - q: How do you mitigate stochastic bias?
    a: >
      Use longer alignments and more genes to average out noise, focus
      on genes with high phylogenetic signal, and filter hypervariable
      or uninformative regions of the alignment.

  - q: What is systematic bias and how does it differ from stochastic bias?
    a: >
      Systematic bias comes from incorrect model assumptions — it is
      persistent and does not decrease with more data. Stochastic bias
      is random and does decrease as more data is added.

  - q: What are the SRH assumptions?
    a: >
      Stationary (base frequencies stay constant over time), Reversible
      (the process looks the same forward and backward), and Homogeneous
      (the same model applies across all branches). Violations of these
      can cause incorrect topologies.

  - q: What is saturation in molecular phylogenetics?
    a: >
      When multiple substitutions accumulate at the same site over time.
      This causes divergence to be underestimated and increases homoplasy,
      leading to loss of phylogenetic signal especially at deep divergences.

  - q: How do you mitigate saturation?
    a: >
      Use slowly evolving genes or amino acid alignments instead of
      nucleotides, apply models that account for multiple hits and rate
      heterogeneity (e.g. Gamma), or use recoding strategies like Dayhoff6
      or RY coding.

  - q: What is Long Branch Attraction (LBA)?
    a: >
      A bias where long branches accumulate so many substitutions that
      some become parallel by chance, making unrelated taxa look falsely
      similar and causing them to cluster together incorrectly.

  - q: What are two ways to mitigate LBA?
    a: >
      (1) Use better-fitting models like GTR+Γ or CAT that account for
      rate variation. (2) Add intermediate taxa to break up long branches,
      reducing the chance of convergent substitutions being mistaken for
      shared ancestry.

  - q: What is composition heterogeneity and why is it a problem?
    a: >
      When different lineages have different nucleotide or amino acid
      frequencies. Taxa with similar compositions cluster together based
      on that similarity rather than true evolutionary ancestry.

  - q: Name two causes of composition heterogeneity.
    a: >
      (1) Varying GC content due to mutation bias. (2) Lifestyle shifts
      such as thermophily, parasitism, or endosymbiosis changing
      metabolic constraints.

  - q: How do you mitigate composition heterogeneity?
    a: >
      Use profile mixture models, apply amino acid or nucleotide recoding
      (e.g. Dayhoff6, SR4, RY), add intermediate taxa to break long
      branches, or exclude taxa that strongly deviate in composition.

  - q: What does a saturation plot show and what does the plateau indicate?
    a: >
      It plots pairwise genetic distance against divergence time. Early
      divergences show a linear increase (good signal). A plateau on the
      right means additional time no longer adds detectable substitutions —
      the sequences are saturated.

  - q: Why do transitions saturate faster than transversions on a saturation plot?
    a: >
      Transitions (purine↔purine, pyrimidine↔pyrimidine) are biochemically
      more frequent, so they accumulate and reach saturation faster than
      transversions.

  - q: Roughly how many genes are needed to resolve deep phylogenies reliably?
    a: >
      Hundreds of loci (100–500) for intermediate depths; thousands of
      genes are recommended for genome-scale studies spanning a wide range
      of divergence times.


mcq:
  - question: "Stochastic bias in phylogenetics is caused by:"
    options:
      - text: Limited data that introduces random noise into the signal
        correct: true
      - text: Using the wrong substitution model for the dataset
        correct: false
      - text: Differences in base composition across lineages studied
        correct: false
      - text: Multiple substitutions accumulating at the same sites
        correct: false
    explanation: >
      Stochastic bias is random error from insufficient data — too few
      genes or too short alignments mean noise can dominate over the true
      phylogenetic signal, even with a correct model.

  - question: What is the key difference between stochastic and systematic bias?
    options:
      - text: Stochastic decreases with more data; systematic does not
        correct: true
      - text: Systematic decreases with more data; stochastic does not
        correct: false
      - text: Both are eliminated by adding more taxa to the dataset
        correct: false
      - text: Both are caused by violations of the SRH assumptions
        correct: false
    explanation: >
      Stochastic bias is random — averaging out with more data.
      Systematic bias is persistent — it stays even with unlimited data
      because it comes from incorrect model assumptions.

  - question: Which set of three terms correctly describes the SRH assumptions?
    options:
      - text: Stationary, Reversible, Homogeneous
        correct: true
      - text: Saturated, Recoded, Heterogeneous
        correct: false
      - text: Symmetric, Random, Hierarchical
        correct: false
      - text: Stochastic, Rapid, Homoplastic
        correct: false
    explanation: >
      SRH stands for Stationary (constant base frequencies), Reversible
      (same process forward and backward), and Homogeneous (same model on
      all branches). Violations of these lead to systematic bias.

  - question: "Saturation occurs when:"
    options:
      - text: Multiple substitutions hit the same site, masking true change
        correct: true
      - text: Base frequencies differ strongly between distant lineages
        correct: false
      - text: Too few genes are used to resolve shallow divergences here
        correct: false
      - text: Long branches are attracted together by random chance alone
        correct: false
    explanation: >
      Saturation is the accumulation of multiple substitutions at the same
      site. The observed distance underestimates the true number of changes,
      reducing phylogenetic signal — especially at deep divergences.

  - question: Which approach best mitigates saturation for deep phylogenies?
    options:
      - text: Use amino acid alignments or slowly evolving gene regions
        correct: true
      - text: Add more taxa sampled from the same time period studied
        correct: false
      - text: Use parsimony to minimize the total number of changes seen
        correct: false
      - text: Increase the number of hypervariable regions in alignment
        correct: false
    explanation: >
      Amino acids are less affected by saturation than nucleotides because
      there are 20 states instead of 4 — the chance of reverting to the
      same state by chance is much lower. Slowly evolving regions also
      accumulate fewer multiple hits.

  - question: "Long Branch Attraction (LBA) causes:"
    options:
      - text: Unrelated long-branched taxa to cluster together falsely
        correct: true
      - text: Short-branched taxa to appear more distantly related here
        correct: false
      - text: Base composition to become uniform across all lineages
        correct: false
      - text: Phylogenetic signal to increase at deeper divergence nodes
        correct: false
    explanation: >
      Long branches accumulate many substitutions. Some of these become
      identical by chance (parallel substitutions), making distantly related
      long-branched taxa look similar — they incorrectly group together.

  - question: "The best way to break up long branches and reduce LBA is to:"
    options:
      - text: Add intermediate taxa that fill in the evolutionary gap
        correct: true
      - text: Remove all taxa with short branches from the analysis
        correct: false
      - text: Switch from maximum likelihood to parsimony as the method
        correct: false
      - text: Use only transitions and exclude transversions from data
        correct: false
    explanation: >
      Adding intermediate taxa breaks long branches into shorter segments,
      reducing the probability that parallel substitutions will accumulate
      and be mistaken for shared ancestry between distant lineages.

  - question: "Composition heterogeneity causes problems in phylogenetics because:"
    options:
      - text: Taxa with similar base frequencies cluster by composition
        correct: true
      - text: It increases the number of informative sites in alignment
        correct: false
      - text: It reduces the substitution rate uniformly across lineages
        correct: false
      - text: It causes short branches to appear much longer than they are
        correct: false
    explanation: >
      When lineages have different base or amino acid frequencies, the
      phylogenetic method may group taxa based on that compositional
      similarity rather than true shared ancestry.

  - question: Which of the following is a cause of composition heterogeneity?
    options:
      - text: Lifestyle shifts such as parasitism or thermophily in taxa
        correct: true
      - text: Using too few genes to resolve shallow evolutionary splits
        correct: false
      - text: Applying a model that assumes rate variation across sites
        correct: false
      - text: Including outgroup taxa that are distantly related to rest
        correct: false
    explanation: >
      Parasitism, thermophily, and endosymbiosis alter metabolic constraints
      and mutation biases in different lineages, leading to different
      nucleotide or amino acid frequencies — a classic source of composition
      heterogeneity.

  - question: "RY recoding is used to mitigate:"
    options:
      - text: Both saturation and composition heterogeneity in nucleotides
        correct: true
      - text: Stochastic bias from having too few genes in the study
        correct: false
      - text: LBA caused by very uneven substitution rates across taxa
        correct: false
      - text: Errors in alignment due to hypervariable indel-rich regions
        correct: false
    explanation: >
      RY recoding collapses nucleotides into purines (R) and pyrimidines (Y),
      reducing the impact of transition saturation and GC-content variation,
      helping with both saturation and composition heterogeneity.

  - question: "On a saturation plot, a plateau on the right side of the graph indicates:"
    options:
      - text: Sequences are saturated — more time adds no new detectable signal
        correct: true
      - text: Sequences are evolving faster than expected at that point
        correct: false
      - text: Transitions and transversions are accumulating at equal rates
        correct: false
      - text: The divergence time estimate is becoming more accurate now
        correct: false
    explanation: >
      The plateau means the observed distance no longer increases with
      greater true divergence — multiple substitutions at the same sites
      erase the historical signal, causing saturation.

  - question: Why do transitions saturate faster than transversions on a saturation plot?
    options:
      - text: Transitions are biochemically more frequent than transversions
        correct: true
      - text: Transversions involve more nucleotide bases changing at once
        correct: false
      - text: Transitions are only found in coding regions of the genome
        correct: false
      - text: Transversions are removed by DNA repair more efficiently
        correct: false
    explanation: >
      Transitions (purine↔purine or pyrimidine↔pyrimidine) happen more
      often because they require smaller biochemical changes. This higher
      frequency means they hit multiple-hit saturation earlier than
      transversions.

  - question: Which model feature best addresses both LBA and rate heterogeneity?
    options:
      - text: GTR+Γ or CAT models that allow rate variation across sites
        correct: true
      - text: Strict parsimony that minimizes total substitutions counted
        correct: false
      - text: A strict molecular clock applied uniformly across all taxa
        correct: false
      - text: Uniform base frequencies assumed across all lineages here
        correct: false
    explanation: >
      Models like GTR+Γ account for variation in substitution rates across
      sites, reducing the tendency to misinterpret parallel substitutions
      on long branches as shared ancestry — directly addressing LBA.

  - question: How many genes are typically recommended for genome-scale phylogenies spanning wide divergence times?
    options:
      - text: Thousands of genes for reliable signal across deep splits
        correct: true
      - text: A single well-chosen gene is always sufficient for accuracy
        correct: false
      - text: Around ten genes are always enough regardless of depth
        correct: false
      - text: Fewer genes reduce noise better than using many loci here
        correct: false
    explanation: >
      Literature guidelines suggest: dozens of genes for shallow splits,
      100–500 for intermediate depths, and thousands for genome-scale
      studies that need to accurately resolve a wide range of divergence
      times.


fill_in_blank:
  - question: >
      ___ bias comes from random noise in limited data. ___ bias
      comes from incorrect model assumptions.
    answers:
      - "Stochastic"
      - "Systematic"

  - question: >
      Stochastic bias ___ with more data. Systematic bias ___
      even when more data is added.
    answers:
      - "decreases"
      - "persists (remains)"

  - question: >
      The SRH assumptions are: ___ (frequencies constant over time),
      ___ (same process forward and backward), and ___ (same model
      on all branches).
    answers:
      - "Stationary"
      - "Reversible"
      - "Homogeneous"

  - question: >
      Saturation occurs when multiple substitutions hit the ___ site,
      causing divergence to be ___ and increasing ___.
    answers:
      - "same"
      - "underestimated"
      - "homoplasy"

  - question: >
      For deep phylogenies, ___ alignments are preferred over
      nucleotides to reduce saturation, because they have ___ possible
      states, making chance reversions less likely.
    answers:
      - "amino acid"
      - "20"

  - question: >
      Long Branch Attraction causes distantly related taxa with ___
      branches to cluster together because of ___ substitutions
      that arise by chance.
    answers:
      - "long"
      - "parallel (convergent)"

  - question: >
      Two ways to mitigate LBA are: adding ___ taxa to break long
      branches, and using better-fitting models like ___ or ___.
    answers:
      - "intermediate"
      - "GTR+Γ"
      - "CAT"

  - question: >
      Composition heterogeneity causes taxa with similar ___ frequencies
      to cluster together based on ___ rather than shared ancestry.
    answers:
      - "base (nucleotide/amino acid)"
      - "composition"

  - question: >
      Two lifestyle shifts that cause composition heterogeneity are
      ___ and ___.
    answers:
      - "thermophily"
      - "parasitism (endosymbiosis)"

  - question: >
      On a saturation plot, a ___ on the right side means sequences
      are saturated. ___ saturate faster than ___ because they are
      biochemically more frequent.
    answers:
      - "plateau"
      - "Transitions"
      - "transversions"

  - question: >
      RY recoding collapses nucleotides into ___ (R) and ___ (Y),
      helping mitigate both ___ and composition heterogeneity.
    answers:
      - "purines"
      - "pyrimidines"
      - "saturation"
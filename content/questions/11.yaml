oral:
  - q: Why do we need complex models beyond simple substitution models?
    a: >
      Real sequence data are heterogeneous — different sites, lineages,
      or regions of an alignment often evolve at different rates, under
      different frequencies, or even different substitution processes.
      Simple models that assume one process for all sites are violated.

  - q: What is the fundamental difference between partition models and mixture models?
    a: >
      Partition models assign each site to a predefined subset before
      analysis — the assignment is fixed. Mixture models do not assign
      sites in advance; instead each site has a probability of belonging
      to multiple model components, inferred from the data.

  - q: What do all three types of partition models share?
    a: >
      They all share the same topology and each partition has its own
      substitution model (Q-matrix). They differ only in how branch
      lengths are handled across partitions.

  - q: Describe the three partition model types for branch lengths.
    a: >
      Edge-linked equal — all partitions share exactly the same branch
      lengths. Edge-linked proportional — each partition scales a shared
      set of branch lengths by its own multiplier. Edge-unlinked — each
      partition has a completely independent set of branch lengths.

  - q: Which partition model is generally recommended and why?
    a: >
      Edge-proportional, because it balances biological realism
      (different partitions evolve at different speeds) against
      overparameterization (unlike edge-unlinked which can overfit
      when partitions are short).

  - q: Why is edge-unlinked dangerous for short partitions?
    a: >
      Short partitions have few informative sites, so they cannot
      reliably estimate their own branch lengths independently —
      the model starts fitting noise rather than true evolutionary signal.

  - q: What is a rate mixture model?
    a: >
      A model where all sites share the same substitution matrix but
      evolve at different rates drawn from a distribution — for example
      the Gamma (+Γ) model, where each site gets its own rate multiplier.

  - q: What is a profile mixture model?
    a: >
      A model where sites can have different base or amino acid frequency
      profiles but share the same substitution matrix. Examples include
      empirical models like LG+C60 and Bayesian models like CAT.

  - q: What is a full mixture model?
    a: >
      Each site may evolve under a completely different substitution
      model — not just a different rate or frequency profile, but a
      different Q-matrix entirely.

  - q: What is heterotachy and which model addresses it?
    a: >
      Heterotachy is when the same site evolves at different rates on
      different branches. The GHOST model addresses it by assigning
      sites probabilistically to classes, each with its own branch
      lengths and Q-matrix, without requiring predefined partitions.

  - q: What is the key difference between GHOST and an edge-unlinked partition model?
    a: >
      GHOST assigns sites to rate classes probabilistically (like a
      mixture model) without any a priori partitioning. Edge-unlinked
      partitions require the user to define partitions in advance.

  - q: In a mixture model, how is the likelihood calculated?
    a: >
      As a weighted sum of the per-component likelihoods across all
      mixture classes — each site contributes to the likelihood of
      every component, weighted by the probability of belonging to it.

  - q: What does LG+C60 mean as a model specification?
    a: >
      LG is the amino acid substitution matrix; C60 refers to a profile
      mixture model with 60 empirical frequency profiles derived from
      large protein datasets, allowing variation in amino acid
      composition across sites.


mcq:
  - question: "Simple substitution models are often violated in real data because:"
    options:
      - text: Different sites and lineages often evolve heterogeneously
        correct: true
      - text: Real sequences always follow a strict molecular clock perfectly
        correct: false
      - text: All sites in an alignment always share the same base frequency
        correct: false
      - text: Sequence alignments are always too short for any model to fit
        correct: false
    explanation: >
      Real data show heterogeneity in rates, frequencies, and substitution
      processes across sites and lineages. Complex models are needed to
      capture this variation rather than assuming one process for all sites.

  - question: "The key difference between partition and mixture models is that:"
    options:
      - text: Partition models use predefined site groups; mixture models do not
        correct: true
      - text: Mixture models use predefined site groups; partition models do not
        correct: false
      - text: Both assign sites to groups, but partition models use probabilities
        correct: false
      - text: Partition models are always better because they use more parameters
        correct: false
    explanation: >
      Partition models require the user to define which sites belong to
      which subset before analysis. Mixture models instead assign sites
      probabilistically to components — no prior grouping is needed.

  - question: "In an edge-linked equal partition model, branch lengths are:"
    options:
      - text: Identical across all partitions — one shared set for all
        correct: true
      - text: Scaled by a multiplier unique to each partition separately
        correct: false
      - text: Estimated independently for every partition in the dataset
        correct: false
      - text: Borrowed from a reference tree and fixed before analysis
        correct: false
    explanation: >
      Edge-linked equal is the most constrained partition model — all
      partitions share exactly the same branch lengths. This is often
      unrealistic because different genes evolve at different speeds.

  - question: "Edge-proportional partition models give each partition:"
    options:
      - text: Branch lengths proportional to a shared set via a scalar multiplier
        correct: true
      - text: Completely independent branch lengths estimated from scratch here
        correct: false
      - text: Exactly the same branch lengths as all other partitions always
        correct: false
      - text: Branch lengths fixed to 1.0 for all branches in every partition
        correct: false
    explanation: >
      Edge-proportional allows each partition to scale a shared base
      set of branch lengths by its own multiplier — faster-evolving
      partitions get longer branches proportionally.

  - question: "Edge-unlinked partition models are risky for short partitions because:"
    options:
      - text: Too few sites means branch lengths are estimated from noise only
        correct: true
      - text: They require more taxa than any other partition model type here
        correct: false
      - text: They cannot accommodate more than one substitution model type
        correct: false
      - text: They always produce longer computation times than Bayesian tools
        correct: false
    explanation: >
      With few informative sites, an edge-unlinked model cannot reliably
      estimate its own independent branch lengths — it overfits noise
      rather than capturing true evolutionary signal.

  - question: Which partition model is generally recommended as the best trade-off?
    options:
      - text: Edge-proportional — balances realism and parameter efficiency
        correct: true
      - text: Edge-equal — simplest and always the most accurate option here
        correct: false
      - text: Edge-unlinked — always preferred because it has more parameters
        correct: false
      - text: No partition model — always use a single model for everything
        correct: false
    explanation: >
      Edge-proportional allows biologically meaningful rate differences
      between partitions without overparameterizing by estimating fully
      independent branch lengths for every partition separately.

  - question: "A rate mixture model (e.g. +Γ) allows sites to differ in their:"
    options:
      - text: Substitution rate, while sharing the same substitution matrix
        correct: true
      - text: Substitution matrix, while sharing exactly the same rate here
        correct: false
      - text: Topology, with each site supporting a different tree structure
        correct: false
      - text: Taxon composition, with different species per site category
        correct: false
    explanation: >
      Rate mixture models like +Γ keep the same Q-matrix for all sites
      but allow each site to draw its rate from a Gamma distribution —
      accounting for fast and slow-evolving positions in the alignment.

  - question: "A profile mixture model accounts for heterogeneity in:"
    options:
      - text: Amino acid or nucleotide frequencies varying across sites
        correct: true
      - text: Substitution rates varying across branches in the phylogeny
        correct: false
      - text: Topology differences between individual gene trees across data
        correct: false
      - text: The number of taxa included in different parts of alignment
        correct: false
    explanation: >
      Profile mixture models allow different sites to have different
      frequency profiles (e.g. some sites may be GC-rich, others AT-rich)
      while sharing the same substitution rate matrix.

  - question: "LG+C60 is an example of:"
    options:
      - text: A profile mixture model with 60 empirical frequency profiles
        correct: true
      - text: A rate mixture model with 60 discrete Gamma rate categories
        correct: false
      - text: A partition model dividing the alignment into 60 subsets here
        correct: false
      - text: A full mixture model with 60 independent substitution matrices
        correct: false
    explanation: >
      LG is the substitution matrix; C60 adds 60 empirical amino acid
      frequency profiles derived from large protein databases, allowing
      composition to vary across sites in the alignment.

  - question: "A full mixture model differs from a profile mixture model because it allows:"
    options:
      - text: Each site to use a completely different substitution matrix
        correct: true
      - text: Each site to have only a different frequency profile assigned
        correct: false
      - text: Each site to evolve at a different rate from a Gamma distribution
        correct: false
      - text: Each site to belong to a predefined partition based on gene type
        correct: false
    explanation: >
      Full mixture models are the most complex — each site can have its
      own Q-matrix, not just a different rate or frequency profile. This
      captures the broadest range of evolutionary heterogeneity.

  - question: "Heterotachy refers to:"
    options:
      - text: The same site evolving at different rates on different branches
        correct: true
      - text: Different sites evolving at different rates on the same branch
        correct: false
      - text: Different genes having different base composition profiles here
        correct: false
      - text: Rate variation across sites modeled by a Gamma distribution
        correct: false
    explanation: >
      Heterotachy is branch-specific rate variation at individual sites —
      the same position may be fast-evolving in one lineage and
      slow-evolving in another. +Γ cannot capture this because it
      assigns one rate per site across all branches.

  - question: "The GHOST model addresses heterotachy by:"
    options:
      - text: Assigning sites probabilistically to classes with own branch lengths
        correct: true
      - text: Requiring the user to predefine partitions for each branch set
        correct: false
      - text: Applying a single Gamma distribution to all sites and branches
        correct: false
      - text: Fixing branch lengths equal across all sites in the alignment
        correct: false
    explanation: >
      GHOST works like a mixture model — sites are probabilistically
      assigned to classes, each with its own branch lengths and Q-matrix,
      without any a priori partitioning by the user.

  - question: "In a mixture model, the likelihood of a site is calculated as:"
    options:
      - text: A weighted sum of likelihoods across all mixture components
        correct: true
      - text: The maximum likelihood across all possible component models
        correct: false
      - text: The likelihood under the best-fitting single substitution model
        correct: false
      - text: An average of branch lengths across all partitions in the data
        correct: false
    explanation: >
      Every site contributes to every component in a mixture model,
      weighted by the probability of belonging to that component.
      The total site likelihood is the weighted sum across all components.

  - question: "Compared to partition models, mixture models have the advantage of:"
    options:
      - text: Not requiring prior knowledge of which sites belong to which class
        correct: true
      - text: Always producing more accurate trees with fewer parameters used
        correct: false
      - text: Being limited to rate variation only, making them simpler to use
        correct: false
      - text: Requiring the user to specify the number of classes in advance
        correct: false
    explanation: >
      Mixture models infer class membership probabilistically from the
      data — no predefined partitioning is needed. This is their key
      advantage when the structure of the data is unknown in advance.


fill_in_blank:
  - question: >
      Simple models assume all sites evolve under the ___ substitution
      process. Complex models are needed when data show ___ in rates,
      frequencies, or substitution processes.
    answers:
      - "same"
      - "heterogeneity"

  - question: >
      ___ models assign sites to predefined subsets before analysis.
      ___ models assign sites probabilistically to components without
      any prior grouping.
    answers:
      - "Partition"
      - "Mixture"

  - question: >
      All partition models share one ___ and each partition has its
      own ___. They differ only in how ___ are handled.
    answers:
      - "topology"
      - "substitution model (Q-matrix)"
      - "branch lengths"

  - question: >
      Edge-linked ___ — all partitions share identical branch lengths.
      Edge-linked ___ — each partition scales a shared set by a multiplier.
      Edge-___ — each partition has fully independent branch lengths.
    answers:
      - "equal"
      - "proportional"
      - "unlinked"

  - question: >
      Edge-___ is the recommended partition model because it balances
      biological ___ with avoiding ___.
    answers:
      - "proportional"
      - "realism"
      - "overparameterization (overfitting)"

  - question: >
      A ___ mixture model varies rate across sites using a Gamma
      distribution. A ___ mixture model varies frequency profiles
      across sites. A ___ mixture model allows each site a different
      substitution matrix entirely.
    answers:
      - "rate"
      - "profile"
      - "full"

  - question: >
      LG+C60 is a ___ mixture model. LG is the ___ matrix and C60
      refers to ___ empirical frequency profiles.
    answers:
      - "profile"
      - "substitution (Q)"
      - "60"

  - question: >
      ___ is when the same site evolves at different rates on different
      branches. The +Γ model cannot capture this because it assigns
      ___ rate per site across all branches.
    answers:
      - "Heterotachy"
      - "one"

  - question: >
      The ___ model addresses heterotachy by assigning sites
      probabilistically to classes, each with its own ___ and
      Q-matrix, without requiring ___ partitioning.
    answers:
      - "GHOST"
      - "branch lengths"
      - "a priori (predefined)"

  - question: >
      In a mixture model, the site likelihood is a ___ sum of
      per-component likelihoods. Each site contributes to ___
      component, weighted by the probability of ___ to it.
    answers:
      - "weighted"
      - "every"
      - "belonging"
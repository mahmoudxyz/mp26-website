oral:
  - q: What is a substitution model?
    a: >
      A mathematical framework (Markov model) that describes the
      probabilities of substitutions occurring between sequence states
      over evolutionary time. It also implicitly corrects for multiple
      substitutions at the same site.

  - q: What is the Markov property in the context of substitution models?
    a: >
      The probability of changing from one state to another depends
      only on the current state — not on the history of previous states.
      Substitution models have no memory of past events.

  - q: What is the difference between a transition and a transversion?
    a: >
      Transitions are substitutions within the same nucleotide class —
      purine to purine (A↔G) or pyrimidine to pyrimidine (C↔T).
      Transversions swap between classes (purine↔pyrimidine). Transitions
      are more frequent because they require a smaller structural change.

  - q: What are the three key assumptions of most substitution models?
    a: >
      (1) Stationarity — base frequencies remain constant over time.
      (2) Time-reversibility — the process looks the same forward and
      backward. (3) Homogeneity — the same model applies across all
      branches and sites.

  - q: List the nucleotide models from simplest to most complex.
    a: >
      JC69 (equal rates, equal frequencies) → K80 (Ts/Tv distinction,
      equal frequencies) → F81 (equal rates, unequal frequencies) →
      HKY85 (Ts/Tv distinction, unequal frequencies) → TN93 (two Ts
      rates, one Tv rate, unequal frequencies) → GTR (six rates,
      unequal frequencies).

  - q: What does GTR stand for and why is it the most general nucleotide model?
    a: >
      General Time Reversible. It has six independent substitution rate
      parameters (one for each nucleotide pair) and allows any base
      frequencies — all simpler models are special cases of GTR with
      some rates constrained to be equal.

  - q: What does adding +Γ to a model do?
    a: >
      It adds Gamma-distributed rate heterogeneity — allowing different
      sites to evolve at different rates drawn from a Gamma distribution
      with shape parameter α. This better fits real data where some
      sites are conserved and others fast-evolving.

  - q: What is the difference between p-distance and corrected distance?
    a: >
      P-distance is the raw proportion of sites that differ between two
      sequences. Corrected distance uses a substitution model to estimate
      the true number of substitutions, accounting for multiple hits at
      the same site that p-distance would miss.

  - q: What do dN and dS measure in codon models?
    a: >
      dS is the rate of synonymous substitutions (no amino acid change).
      dN is the rate of non-synonymous substitutions (amino acid changes).
      Their ratio ω = dN/dS is used to infer selective pressure.

  - q: How do you interpret ω (dN/dS) values?
    a: >
      ω < 1 means purifying selection — amino acid changes are being
      removed. ω = 1 means neutral evolution. ω > 1 means positive
      (adaptive) selection — amino acid changes are being favored.

  - q: What is the difference between empirical and mechanistic substitution models?
    a: >
      Mechanistic models (like nucleotide models) estimate parameters
      directly from the dataset being analyzed. Empirical models (like
      amino acid models — PAM, JTT, WAG, LG) use pre-estimated
      parameters derived from large external protein databases.

  - q: Name four amino acid substitution models in rough historical order.
    a: >
      PAM (Dayhoff 1978) → JTT (Jones et al. 1992) → WAG (Whelan &
      Goldman 2001) → LG (Le & Gascuel 2008). Each was derived from
      larger and more diverse datasets than its predecessor, generally
      improving fit to real protein data.

  - q: What is the Q-matrix in a substitution model?
    a: >
      The instantaneous rate matrix that specifies the rate of change
      from each nucleotide to every other. Diagonal elements are set
      so each row sums to zero, ensuring total probability is conserved.

  - q: What does +I add to a substitution model?
    a: >
      An invariant sites parameter — a proportion of sites is fixed
      at zero rate (completely invariable). Combined with +Γ, it allows
      both invariant and rate-variable sites in the same model.

  - q: Why is saturation a problem and how does it relate to p-distance?
    a: >
      Saturation occurs when multiple substitutions have hit the same
      site, so the true number of changes is underestimated. P-distance
      misses these multiple hits; corrected distances use models to
      account for them.


mcq:
  - question: "A substitution model is defined as a:"
    options:
      - text: Markov model describing probabilities of sequence change over time
        correct: true
      - text: Statistical test comparing two alternative tree topologies here
        correct: false
      - text: Method for aligning homologous sequences across species sets
        correct: false
      - text: Algorithm for finding the tree with the fewest substitutions
        correct: false
    explanation: >
      A substitution model is a Markov model — it describes, probabilistically,
      how sequences change over evolutionary time. It also corrects for
      multiple substitutions at the same site.

  - question: "The Markov property means that substitution probability depends on:"
    options:
      - text: Only the current nucleotide state, not the history of changes
        correct: true
      - text: The entire history of past substitutions at that exact site
        correct: false
      - text: The substitution rates of all neighboring sites in sequence
        correct: false
      - text: The branch length of the lineage from root to that taxon
        correct: false
    explanation: >
      The Markov property means the system has no memory — the probability
      of the next state depends only on the current state, regardless of
      how the system arrived there.

  - question: "Transitions are more frequent than transversions because:"
    options:
      - text: They swap within the same nucleotide class (smaller change)
        correct: true
      - text: They always result in synonymous amino acid substitutions
        correct: false
      - text: They are the only changes corrected by substitution models
        correct: false
      - text: They occur exclusively at the third codon position only
        correct: false
    explanation: >
      Transitions (A↔G or C↔T) involve nucleotides of the same biochemical
      class — purines or pyrimidines — requiring a smaller structural change
      and therefore occurring more frequently than transversions.

  - question: "JC69 (Jukes-Cantor) assumes:"
    options:
      - text: Equal base frequencies and equal rates for all substitutions
        correct: true
      - text: Unequal base frequencies and equal rates for substitutions
        correct: false
      - text: One transition rate and one transversion rate are different
        correct: false
      - text: Six independent rates between all nucleotide pairs allowed
        correct: false
    explanation: >
      JC69 is the simplest model — one single rate for all substitutions
      and equal frequencies (25%) for all four nucleotides. It is used
      as a baseline and is a special case of GTR.

  - question: "K80 (Kimura 2-Parameter) differs from JC69 because K80:"
    options:
      - text: Distinguishes between transition and transversion rates
        correct: true
      - text: Allows each base to have its own equilibrium frequency
        correct: false
      - text: Uses six independent rates between all nucleotide pairs
        correct: false
      - text: Adds a gamma parameter for among-site rate variation here
        correct: false
    explanation: >
      K80 keeps equal base frequencies (25% each) but adds a second
      parameter — a separate rate for transitions vs transversions —
      better fitting the commonly observed transition bias in real data.

  - question: HKY85 combines the features of which two simpler models?
    options:
      - text: F81 (unequal frequencies) and K80 (Ts/Tv distinction)
        correct: true
      - text: JC69 (equal rates) and K3P (two transversion rates here)
        correct: false
      - text: GTR (six rates) and JC69 (one rate, equal frequencies)
        correct: false
      - text: TN93 (two Ts rates) and F81 (unequal base frequencies)
        correct: false
    explanation: >
      HKY85 allows unequal base frequencies (like F81) AND distinguishes
      transition from transversion rates (like K80) — combining both
      biologically important features in one model.

  - question: "GTR is the most general reversible nucleotide model because:"
    options:
      - text: It has six independent rate parameters and free base frequencies
        correct: true
      - text: It assumes all sites evolve at exactly the same constant rate
        correct: false
      - text: It is the only model that allows transition and transversion bias
        correct: false
      - text: It requires no parameters — all rates are estimated externally
        correct: false
    explanation: >
      GTR has one rate parameter for each of the six nucleotide pairs and
      allows any base frequencies. All simpler models (JC, K80, HKY, etc.)
      are special cases of GTR with certain parameters constrained equal.

  - question: "Adding +Γ to a model means:"
    options:
      - text: Sites can evolve at different rates drawn from a Gamma distribution
        correct: true
      - text: A proportion of sites is fixed as completely invariable forever
        correct: false
      - text: The model assumes all sites evolve at exactly the same rate
        correct: false
      - text: The transition/transversion ratio is allowed to vary per site
        correct: false
    explanation: >
      +Γ (Gamma rate heterogeneity) adds a shape parameter α to allow
      sites to evolve at different rates. Low α means high rate variation;
      high α means rates are more uniform across sites.

  - question: "P-distance underestimates true evolutionary distance because:"
    options:
      - text: It ignores multiple substitutions that may hit the same site
        correct: true
      - text: It overcounts transitions while ignoring transversions here
        correct: false
      - text: It uses a complex model that penalizes frequent substitutions
        correct: false
      - text: It only works for closely related sequences with few gaps
        correct: false
    explanation: >
      P-distance simply counts observed differences. When the same site
      has been hit multiple times, some changes are invisible — the true
      distance is larger. Corrected distances use models to account for this.

  - question: "In codon models, synonymous substitutions (dS) are generally more common because:"
    options:
      - text: They do not change the amino acid, so selection is relaxed
        correct: true
      - text: They always occur at the first position of every codon only
        correct: false
      - text: They are less likely to be corrected by DNA repair enzymes
        correct: false
      - text: They increase protein function and are therefore positively selected
        correct: false
    explanation: >
      Synonymous changes do not alter the protein sequence, so they face
      less selective constraint and are fixed more freely. Non-synonymous
      changes often affect protein function and are more frequently removed
      by purifying selection.

  - question: "ω = dN/dS > 1 indicates:"
    options:
      - text: Positive (adaptive) selection — amino acid changes are favored
        correct: true
      - text: Purifying selection — deleterious mutations are being removed
        correct: false
      - text: Neutral evolution — changes have no fitness effect at all
        correct: false
      - text: Saturation — multiple substitutions have hit the same site
        correct: false
    explanation: >
      When non-synonymous changes (dN) accumulate faster than synonymous
      ones (dS), selection is actively favoring amino acid changes — a
      signature of adaptive or positive selection.

  - question: "ω = dN/dS < 1 indicates:"
    options:
      - text: Purifying selection — amino acid changes are being removed
        correct: true
      - text: Positive selection — adaptive evolution is driving changes
        correct: false
      - text: Neutral evolution — all changes are selectively equivalent
        correct: false
      - text: Saturation — the gene has reached substitution equilibrium
        correct: false
    explanation: >
      ω < 1 means non-synonymous changes are rarer than synonymous ones
      — most amino acid changes are harmful and are removed by purifying
      (negative) selection, as is typical for most functional proteins.

  - question: "Amino acid substitution models (PAM, JTT, WAG, LG) are called empirical because:"
    options:
      - text: Their parameters are pre-estimated from large external datasets
        correct: true
      - text: Their parameters are estimated fresh from each new dataset
        correct: false
      - text: They model the biological mechanism of mutation directly here
        correct: false
      - text: They require no parameters — all rates are assumed equal here
        correct: false
    explanation: >
      Empirical protein models use substitution frequencies derived from
      large protein databases. Unlike mechanistic nucleotide models, the
      rates are fixed from external training data, not re-estimated per dataset.

  - question: Which amino acid model is generally considered the most accurate and recent?
    options:
      - text: LG (Le & Gascuel 2008) — derived from a vast ML-optimized dataset
        correct: true
      - text: PAM (Dayhoff 1978) — the original and most widely validated model
        correct: false
      - text: BLOSUM62 — derived from ungapped conserved protein blocks only
        correct: false
      - text: JTT (Jones 1992) — the standard model used in all modern analyses
        correct: false
    explanation: >
      LG (2008) was derived using maximum likelihood on a large, diverse
      alignment database and generally outperforms older models like WAG,
      JTT, and PAM in fitting real protein phylogenetic data.

  - question: "The diagonal elements of the Q-matrix are set so that:"
    options:
      - text: Each row sums to zero, conserving total probability over time
        correct: true
      - text: Each column sums to one, representing equilibrium frequencies
        correct: false
      - text: All off-diagonal elements are equal for a reversible process
        correct: false
      - text: The largest value is always placed on the main diagonal here
        correct: false
    explanation: >
      In a Q-matrix, the diagonal element for each state is set to the
      negative sum of all off-diagonal rates in that row. This ensures
      the total probability across all states is conserved (sums to zero).


fill_in_blank:
  - question: >
      A substitution model is a ___ model that describes the probability
      of sequence changes over time. It corrects for ___ substitutions
      at the same site.
    answers:
      - "Markov"
      - "multiple"

  - question: >
      The Markov property means substitution probability depends only
      on the ___ state — the model has no ___ of past events.
    answers:
      - "current"
      - "memory"

  - question: >
      ___ are substitutions within the same nucleotide class (A↔G,
      C↔T). ___ swap between classes. Transitions are more ___
      than transversions.
    answers:
      - "Transitions"
      - "Transversions"
      - "frequent"

  - question: >
      JC69 assumes ___ base frequencies and ___ substitution rates.
      K80 keeps equal frequencies but adds a separate rate for ___
      vs ___.
    answers:
      - "equal"
      - "equal"
      - "transitions"
      - "transversions"

  - question: >
      HKY85 combines ___ base frequencies (from F81) with a ___/___
      rate distinction (from K80). GTR has ___ independent rate
      parameters and is the most general reversible model.
    answers:
      - "unequal"
      - "transition"
      - "transversion"
      - "six"

  - question: >
      Adding +___ allows sites to evolve at different rates drawn from
      a Gamma distribution. Adding +___ fixes a proportion of sites
      as completely invariable.
    answers:
      - "Γ (Gamma)"
      - "I"

  - question: >
      ___ distance counts the raw proportion of differing sites.
      ___ distance uses a substitution model to account for multiple
      hits and gives a more accurate estimate of true divergence.
    answers:
      - "p (observed)"
      - "Corrected (expected)"

  - question: >
      In codon models, ___ substitutions do not change the amino
      acid. ___ substitutions do. Their ratio ω = ___/___ measures
      selective pressure.
    answers:
      - "synonymous"
      - "non-synonymous"
      - "dN"
      - "dS"

  - question: >
      ω < 1 indicates ___ selection. ω = 1 indicates ___
      evolution. ω > 1 indicates ___ selection.
    answers:
      - "purifying"
      - "neutral"
      - "positive (adaptive)"

  - question: >
      Amino acid models are called ___ because parameters are
      pre-estimated from large external datasets. Nucleotide models
      are ___ — parameters are estimated from the dataset itself.
    answers:
      - "empirical"
      - "mechanistic"

  - question: >
      Four amino acid models in historical order are: ___ (1978),
      ___ (1992), ___ (2001), and ___ (2008).
    answers:
      - "PAM"
      - "JTT"
      - "WAG"
      - "LG"

  - question: >
      The three key assumptions of substitution models are:
      ___ (frequencies constant), ___ (same forward and backward),
      and ___ (same model on all branches).
    answers:
      - "stationarity"
      - "reversibility"
      - "homogeneity"
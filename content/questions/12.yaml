# LESSON 12 — Discordance, ILS & the Coalescent
# Simplified & Exam-Ready Question Bank

oral:
  - q: What is a species tree?
    a: A tree showing the order of speciation events — the true evolutionary history of the species.

  - q: What is a gene tree?
    a: A tree showing the evolutionary history of one specific gene. It can differ from the species tree.

  - q: Can a gene tree differ from the species tree for biological reasons?
    a: Yes. The three main causes are ILS, horizontal gene transfer, and hybridization.

  - q: What does ILS stand for?
    a: Incomplete Lineage Sorting.

  - q: In one sentence, what is ILS?
    a: Old genetic variation from an ancestor persists through a speciation event and gets sorted randomly into descendant species.

  - q: When is ILS most likely to happen?
    a: When Ne is large AND speciation events happen close together in time — meaning short internal branches.

  - q: What is the coalescent?
    a: A model that traces gene lineages backwards in time to find when they shared a common ancestor.

  - q: Is the coalescent a forward or backward model?
    a: Backward — it starts in the present and looks into the past.

  - q: Who formalized the coalescent model?
    a: John Kingman, in 1982.

  - q: What is the probability that two gene copies coalesce in one generation?
    a: 1 divided by 2Ne, where Ne is the effective population size.

  - q: What is the expected waiting time for two gene copies to coalesce?
    a: 2Ne generations.

  - q: What happens to coalescence time when Ne is large?
    a: It takes longer — lineages need more generations to find a common ancestor.

  - q: What is horizontal gene transfer?
    a: When genetic material moves between unrelated species, not through parent-offspring inheritance.

  - q: What is hybridization in the context of gene tree discordance?
    a: When two species interbreed, mixing genes across lineage boundaries so some genes reflect the wrong species history.

  - q: What does RF distance measure?
    a: How topologically different two trees are, by counting branches present in one tree but absent in the other.

  - q: What does an RF distance of 0 mean?
    a: The two trees are topologically identical.

  - q: What is the main weakness of RF distance?
    a: It treats all differences equally, regardless of whether the conflict is deep or shallow.

  - q: What is the main problem with concatenation for species tree inference?
    a: It assumes all genes share exactly the same evolutionary history, which is often wrong.

  - q: What is ASTRAL's input?
    a: A set of individual gene trees estimated separately.

  - q: What MSC prediction does ASTRAL rely on?
    a: For any four species, the most frequent gene tree topology across loci matches the species tree.

  - q: What are coalescent units?
    a: A branch length scale where one unit equals 2Ne generations.

  - q: What does a short branch in coalescent units mean biologically?
    a: High ILS probability — lineages had little time to coalesce before the next speciation.

  - q: What is the anomaly zone?
    a: When internal branches are so short that discordant gene trees are actually more common than the species tree topology.

  - q: What happens to ASTRAL in the anomaly zone?
    a: It becomes statistically inconsistent and can recover the wrong species tree.

  - q: Name one site-based coalescent method.
    a: SVDQuartets or SNAPP.

  - q: Name one Bayesian co-estimation method.
    a: StarBEAST2.

  - q: Why is StarBEAST2 rarely used for large datasets?
    a: It is very computationally expensive because it jointly estimates all gene trees and the species tree at once.

  - q: What is Local Posterior Probability in ASTRAL?
    a: A branch support value from 0 to 1, estimating how likely a branch is correct based on quartet frequencies.


mcq:
  - question: What does a gene tree represent?
    options:
      - text: The order of speciation events in a clade
        correct: false
      - text: The evolutionary history of one gene locus
        correct: true
      - text: The combined history of all genes together
        correct: false
      - text: The demographic history of a population
        correct: false
    explanation: >
      A gene tree traces the history of a single locus.
      It can differ from the species tree due to ILS, HGT, or hybridization.

  - question: Which two conditions make ILS most likely?
    options:
      - text: Small Ne and long internal branches
        correct: false
      - text: Large Ne and short internal branches
        correct: true
      - text: Large Ne and long internal branches
        correct: false
      - text: Small Ne and short internal branches
        correct: false
    explanation: >
      Large Ne means ancestral variation persists longer.
      Short internal branches mean less time to sort before the next speciation.
      Both together maximize ILS probability.

  - question: 'The coalescent is best described as a model that looks:'
    options:
      - text: Forward in time to predict future mutations
        correct: false
      - text: Backward in time to find common ancestors
        correct: true
      - text: Sideways to compare sister species genomes
        correct: false
      - text: Forward in time to model speciation events
        correct: false
    explanation: >
      The coalescent is retrospective. Starting from the present,
      it traces gene lineages backward until they meet a common ancestor.

  - question: "The probability of two gene copies coalescing in one generation is:"
    options:
      - text: 1 / Ne
        correct: false
      - text: 1 / (2Ne)
        correct: true
      - text: 2 / Ne
        correct: false
      - text: Ne / 2
        correct: false
    explanation: >
      In a diploid population there are 2Ne gene copies.
      The chance two randomly chosen copies share the same parent is 1/(2Ne).

  - question: "The expected coalescence time for two gene copies is:"
    options:
      - text: Ne generations
        correct: false
      - text: 2Ne generations
        correct: true
      - text: 4Ne generations
        correct: false
      - text: Ne / 2 generations
        correct: false
    explanation: >
      Since coalescence probability per generation is 1/(2Ne),
      the expected waiting time is 2Ne generations.

  - question: What is Incomplete Lineage Sorting (ILS)?
    options:
      - text: Gene flow caused by two species hybridizing
        correct: false
      - text: Ancestral variation persisting across a speciation event
        correct: true
      - text: Genes transferred between unrelated lineages
        correct: false
      - text: Errors introduced during DNA sequencing steps
        correct: false
    explanation: >
      ILS happens when ancestral alleles do not coalesce before a speciation event splits the population.
      Different alleles land in different descendant species, producing a conflicting gene tree.

  - question: "The most common gene tree topology across loci, under the MSC, is:"
    options:
      - text: Always fully different from the species tree
        correct: false
      - text: The same topology as the species tree
        correct: true
      - text: Randomly distributed with no consistent pattern
        correct: false
      - text: Always matching the HGT donor topology
        correct: false
    explanation: >
      Key MSC prediction: for any four taxa, the species tree topology is
      the plurality gene tree topology. ASTRAL exploits this fact directly.

  - question: "ASTRAL builds the species tree by:"
    options:
      - text: Merging all gene sequences into one alignment
        correct: false
      - text: Counting quartet topologies across all gene trees
        correct: true
      - text: Estimating effective population size per branch
        correct: false
      - text: Selecting the gene tree closest to the median
        correct: false
    explanation: >
      ASTRAL breaks each gene tree into all possible four-taxon groups (quartets)
      and finds the species tree that matches the most quartet topologies.

  - question: "HGT causes gene tree discordance because:"
    options:
      - text: The transferred gene accelerates its mutation rate
        correct: false
      - text: The transferred gene reflects the donor lineage history
        correct: true
      - text: The transferred gene loses all phylogenetic signal
        correct: false
      - text: The transferred gene always creates very long branches
        correct: false
    explanation: >
      A transferred gene carries the history of the donor lineage, not the recipient.
      Including it in a species tree analysis introduces a conflicting history.

  - question: "Robinson-Foulds (RF) distance counts:"
    options:
      - text: Total branch length difference between two trees
        correct: false
      - text: Branches present in one tree but not the other
        correct: true
      - text: Taxa placed differently between the two trees
        correct: false
      - text: Number of nodes shared between both trees
        correct: false
    explanation: >
      RF counts the symmetric difference of bipartition sets.
      RF = 0 means identical topology; higher RF = more disagreement.

  - question: "The main weakness of RF distance is that it:"
    options:
      - text: Cannot handle datasets with more than 20 taxa
        correct: false
      - text: Treats all topological differences as equally important
        correct: true
      - text: Requires branch lengths to be provided as input
        correct: false
      - text: Only works correctly on fully rooted trees
        correct: false
    explanation: >
      RF assigns the same weight to every bipartition difference,
      whether it is a deep conflict affecting many taxa or a minor tip rearrangement.

  - question: "Branch lengths in ASTRAL are measured in:"
    options:
      - text: Substitutions per site across all loci
        correct: false
      - text: Millions of years of divergence time
        correct: false
      - text: Coalescent units scaled by Ne generations
        correct: true
      - text: Number of conflicting gene tree bipartitions
        correct: false
    explanation: >
      Coalescent units = t / (2Ne). Short coalescent branches mean high ILS.
      Long coalescent branches mean low ILS.

  - question: "The anomaly zone is a problem because:"
    options:
      - text: ASTRAL runs out of memory on very large datasets
        correct: false
      - text: Discordant gene trees outnumber the species tree topology
        correct: true
      - text: The coalescent model stops applying entirely
        correct: false
      - text: All gene trees become identical to each other
        correct: false
    explanation: >
      In the anomaly zone, a discordant topology is more frequent than the concordant one.
      ASTRAL's plurality vote then confidently picks the wrong species tree.

  - question: "Concatenation is risky for species tree inference because:"
    options:
      - text: It needs far more memory than ASTRAL requires
        correct: false
      - text: It assumes one shared history for all genes
        correct: true
      - text: It cannot handle datasets with more than 4 taxa
        correct: false
      - text: It completely ignores branch length information
        correct: false
    explanation: >
      Concatenation assumes all genes evolved the same way.
      Violating this assumption — e.g. due to ILS — can cause it to
      confidently recover the wrong species tree.

  - question: "StarBEAST2 differs from ASTRAL because it:"
    options:
      - text: Works only with mitochondrial gene sequences
        correct: false
      - text: Estimates gene trees and species tree jointly
        correct: true
      - text: Ignores the coalescent model completely
        correct: false
      - text: Requires no input sequence data at all
        correct: false
    explanation: >
      StarBEAST2 simultaneously infers all gene trees, the species tree, Ne,
      and divergence times under a full coalescent model. More rigorous but very slow.


fill_in_blank:
  - question: >
      A _______________ tree shows the history of speciation events,
      while a _______________ tree shows the history of one locus.
    answers:
      - "species"
      - "gene"

  - question: >
      The three main biological causes of gene tree discordance are
      _______________, _______________, and _______________.
    answers:
      - "ILS"
      - "HGT"
      - "hybridization / introgression"

  - question: >
      ILS is most likely when Ne is _______________ and internal branches are _______________.
    answers:
      - "large"
      - "short"

  - question: >
      The coalescent is a _______________ model — it looks _______________ in time.
    answers:
      - "retrospective"
      - "backward"

  - question: >
      The probability that two gene copies coalesce in one generation is _______________,
      so the expected waiting time to coalescence is _______________ generations.
    answers:
      - "1/(2Ne)"
      - "2Ne"

  - question: >
      ASTRAL exploits the fact that the most _______________ gene tree topology
      across loci matches the _______________ tree.
    answers:
      - "frequent"
      - "species"

  - question: >
      RF distance = 0 means the two trees are _______________.
      Its main weakness is that it weights all bipartition differences _______________.
    answers:
      - "identical"
      - "equally"

  - question: >
      Branch lengths in ASTRAL are in _______________ units,
      where 1 unit equals _______________ generations.
    answers:
      - "coalescent"
      - "2Ne"

  - question: >
      In the anomaly zone, internal branches are so _______________ that
      _______________ gene tree topologies become more frequent than the species tree.
    answers:
      - "short"
      - "discordant"

  - question: >
      StarBEAST2 is _______________ than ASTRAL because it _______________
      estimates gene trees and the species tree under a full coalescent model.
    answers:
      - "slower / more computationally expensive"
      - "jointly"
oral:
  - q: Why does taxon sampling matter in phylogenetics?
    a: >
      Poor sampling causes long branch attraction, creates artificial
      monophyletic groups, reduces phylogenetic signal, and skews
      evolutionary rate estimates. Broad, representative sampling
      breaks up long branches and improves tree accuracy.

  - q: What is the difference between homology and analogy?
    a: >
      Homologous characters share a common ancestry. Analogous characters
      share the same function but have different evolutionary origins —
      they are a type of homoplasy.

  - q: Define ortholog, paralog, and xenolog.
    a: >
      Orthologs — genes in different species whose last common ancestor
      was a speciation event; they track the species tree. Paralogs —
      genes whose last common ancestor was a gene duplication event.
      Xenologs — genes whose last common ancestor was a horizontal
      gene transfer event.

  - q: Why do we use orthologs and not paralogs for phylogenetics?
    a: >
      Orthologs arise through speciation, so their evolutionary history
      mirrors the history of the species. Paralogs arise through
      duplication, so their gene tree does not necessarily reflect
      the species tree.

  - q: What distinguishes orthologs from paralogs at the most fundamental level?
    a: >
      The mechanism at their most recent common ancestor — speciation
      for orthologs, gene duplication for paralogs. It is not about
      the sequences themselves or their function.

  - q: What is the difference between in-paralogs and out-paralogs?
    a: >
      In-paralogs arose by duplication AFTER a speciation event —
      restricted to one lineage. Out-paralogs arose by duplication
      BEFORE a speciation event — present in the common ancestor
      of both species.

  - q: What is an orthogroup?
    a: >
      A group of homologous genes all descending from the most recent
      common ancestor of a set of species — it extends the concept
      of orthology to multiple species simultaneously.

  - q: How does Reciprocal Best Hit (RBH) work?
    a: >
      An all-vs-all BLAST is run between two genomes. Gene A in
      species 1 is an RBH of gene X in species 2 only if A's best
      hit is X AND X's best hit is A — both directions must agree.

  - q: What is the biggest limitation of RBH?
    a: >
      It fails to detect one-to-many or many-to-many orthologs.
      If one gene in species 1 corresponds to multiple copies in
      species 2, RBH will miss those relationships.

  - q: Name two advantages of transcriptomes over genomes for phylogenetics.
    a: >
      Transcriptomes are much cheaper (€250–500 vs thousands for
      genomes), allowing more species to be sampled, and they do
      not require a reference genome.

  - q: What is the main disadvantage of mitochondrial genomes for deep phylogenies?
    a: >
      Their high substitution rate leads to saturation and homoplasy
      at deeper divergences, and they provide only a limited number
      of genetic markers (usually around 15 genes).

  - q: What are UCEs and what is their key advantage over RADseq?
    a: >
      Ultraconserved Elements — short conserved genomic regions captured
      by targeted probes. They work on ethanol-fixed and museum specimens,
      whereas RADseq is limited to closely related species and
      population-level studies.

  - q: What is the cheapest sequencing approach and what are its limitations?
    a: >
      GBS (Genotyping-By-Sequencing) at €50–200. It only produces
      short SNPs, not full genes, and is only suitable for population
      genomics or very closely related species — no proper orthology
      inference is possible.

  - q: What is the orthology conjecture and why should it be used with caution?
    a: >
      The orthology conjecture (Nehrt et al. 2011) proposes that
      orthologs share the same biological function while paralogs
      differ. This has been widely questioned — function should not
      be used to define orthology; only the mechanism of origin matters.

  - q: In phylogenetics, which type of orthogroup is traditionally preferred?
    a: >
      Single-copy or one-to-one orthogroups — those with exactly one
      copy per species — because they are unambiguously orthologous
      and their gene tree is most likely to reflect the species tree.


mcq:
  - question: What is the main consequence of poor taxon sampling in phylogenetics?
    options:
      - text: Long branch attraction and artificial clade groupings
        correct: true
      - text: More parsimony-informative sites in the alignment used
        correct: false
      - text: Increased accuracy in divergence time estimation results
        correct: false
      - text: Better resolution of shallow and recent speciation events
        correct: false
    explanation: >
      Missing taxa leave gaps that make distant lineages appear closer,
      causing long branch attraction and artificial groupings. Adding
      intermediate taxa breaks long branches and improves accuracy.

  - question: "Homologous characters are defined by:"
    options:
      - text: Sharing a common evolutionary ancestry between organisms
        correct: true
      - text: Performing the same biological function in both organisms
        correct: false
      - text: Having identical DNA sequences in two compared species
        correct: false
      - text: Being inherited through horizontal gene transfer events
        correct: false
    explanation: >
      Homology is strictly about shared ancestry — two characters are
      homologous if they descended from the same character in a common
      ancestor, regardless of their current function.

  - question: "Analogous characters (analogy) differ from homologous ones because they:"
    options:
      - text: Share function but have different evolutionary origins
        correct: true
      - text: Share ancestry but have evolved very different functions
        correct: false
      - text: Are identical in sequence but found in different organisms
        correct: false
      - text: Arose through gene duplication within the same genome
        correct: false
    explanation: >
      Analogy is a type of homoplasy — similar function evolved
      independently in unrelated lineages, not inherited from a
      common ancestor. Example: wings in birds and insects.

  - question: "Orthologous genes arise through:"
    options:
      - text: Speciation — the last common ancestor was a species split
        correct: true
      - text: Gene duplication — an extra copy formed within a genome
        correct: false
      - text: Horizontal gene transfer — a gene moved between species
        correct: false
      - text: Recombination — two genes fused into a single hybrid gene
        correct: false
    explanation: >
      Orthologs are defined by speciation as the most recent common
      ancestor event. Because they diverged when species split, their
      gene tree is expected to match the species tree.

  - question: "Paralogous genes arise through:"
    options:
      - text: Gene duplication within or across lineages in evolution
        correct: true
      - text: A speciation event that separated two different species
        correct: false
      - text: Horizontal gene transfer between two unrelated organisms
        correct: false
      - text: Recombination between two chromosomes during cell division
        correct: false
    explanation: >
      Paralogs are copies created by gene duplication. Their gene
      tree reflects the duplication event, not the species tree —
      which is why they are problematic for species phylogenetics.

  - question: Why are orthologs preferred over paralogs in species tree inference?
    options:
      - text: Their history reflects speciation and mirrors species history
        correct: true
      - text: They are always present in higher copy numbers per species
        correct: false
      - text: They evolve faster and give more phylogenetic signal here
        correct: false
      - text: They can be identified without any sequence alignment needed
        correct: false
    explanation: >
      Orthologs arise at speciation events, so their evolutionary
      history matches the species tree. Paralogs arise at duplications,
      so their gene tree may contradict the species tree.

  - question: "In-paralogs differ from out-paralogs because in-paralogs:"
    options:
      - text: Arose by duplication AFTER the speciation event in question
        correct: true
      - text: Arose by duplication BEFORE the speciation event occurred
        correct: false
      - text: Are only found in prokaryotes due to frequent duplication
        correct: false
      - text: Are always present in both species as identical sequences
        correct: false
    explanation: >
      In-paralogs duplicated after speciation — they are restricted
      to one lineage. Out-paralogs duplicated before speciation —
      they are present in the ancestor and inherited by both species.

  - question: "An orthogroup is defined as:"
    options:
      - text: All homologous genes descending from the MRCA of a set of species
        correct: true
      - text: A pair of genes with identical sequences across two genomes
        correct: false
      - text: A single gene that is one-to-one orthologous across species
        correct: false
      - text: Any gene family regardless of the duplication or transfer
        correct: false
    explanation: >
      An orthogroup extends orthology to multiple species. It groups
      all homologous genes descending from the most recent common
      ancestor of the species being compared — always defined by
      a reference speciation event.

  - question: "In Reciprocal Best Hit (RBH), two genes are considered orthologs only if:"
    options:
      - text: Each is the other's top BLAST hit in both search directions
        correct: true
      - text: They share more than 90% sequence identity in alignment
        correct: false
      - text: They are found on the same chromosome in both genomes
        correct: false
      - text: One is the best hit of the other in only one direction
        correct: false
    explanation: >
      RBH requires both directions to agree — gene A in species 1
      must hit gene X in species 2 as its best match, AND gene X
      must hit gene A as its best match in return.

  - question: "The biggest limitation of RBH is that it:"
    options:
      - text: Cannot detect one-to-many or many-to-many ortholog pairs
        correct: true
      - text: Requires a reference genome from a closely related species
        correct: false
      - text: Only works for mitochondrial genes and not nuclear genes
        correct: false
      - text: Overestimates the number of orthologs in large gene families
        correct: false
    explanation: >
      RBH only finds one-to-one relationships. If a gene in species 1
      duplicated in species 2, RBH picks only one match and misses
      the others — requiring orthogroup clustering methods instead.

  - question: Which sequencing approach is best for a study needing many species at low cost?
    options:
      - text: Transcriptomes — cheap and genome-independent per species
        correct: true
      - text: Chromosome-level genomes — expensive but most accurate
        correct: false
      - text: PCR gene fragments — targeted but limited to one gene each
        correct: false
      - text: RADseq — cheapest but only for closely related species
        correct: false
    explanation: >
      Transcriptomes cost €250–500 per sample, produce thousands of
      markers, and require no reference genome — making them ideal
      for sampling many species across a wide phylogenetic range.

  - question: "Mitochondrial genomes are NOT recommended for deep phylogenies because:"
    options:
      - text: High substitution rates cause saturation and homoplasy
        correct: true
      - text: They are expensive and difficult to sequence from tissues
        correct: false
      - text: They provide too many markers making analysis unwieldy
        correct: false
      - text: They are biparentally inherited and track both parents
        correct: false
    explanation: >
      Mitogenomes evolve fast — great for shallow phylogenies but
      problematic at deep divergences because multiple substitutions
      at the same site (saturation) erase the true historical signal.

  - question: "RADseq and GBS are most appropriate for:"
    options:
      - text: Population genomics or closely related species studies
        correct: true
      - text: Reconstructing deep animal phylogenies across major phyla
        correct: false
      - text: Obtaining full gene sequences for orthology inference
        correct: false
      - text: Studies requiring museum and ethanol-fixed ancient specimens
        correct: false
    explanation: >
      RADseq/GBS only produce short SNP markers at restriction sites —
      not full genes. They work at population or closely-related-species
      level but cannot resolve deeper phylogenetic relationships.

  - question: "UCEs (Ultraconserved Elements) have an advantage over RADseq because they:"
    options:
      - text: Work on museum and ethanol-fixed specimens across wider depths
        correct: true
      - text: Provide full-length gene sequences with proper annotation
        correct: false
      - text: Are the cheapest sequencing method available for any study
        correct: false
      - text: Allow proper orthology inference without targeted probes
        correct: false
    explanation: >
      UCEs are captured by hybridization probes and work on degraded
      DNA from ethanol-fixed or museum specimens. They cover moderate
      to large phylogenetic distances — broader than RADseq.

  - question: "The key principle for distinguishing orthologs, paralogs, and xenologs is:"
    options:
      - text: The mechanism at the most recent common ancestor of the genes
        correct: true
      - text: The similarity of function between the genes across species
        correct: false
      - text: The percentage of sequence identity shared between copies
        correct: false
      - text: Whether the genes are found on the same chromosome location
        correct: false
    explanation: >
      The category is determined entirely by HOW the genes came to
      share ancestry — speciation (orthologs), duplication (paralogs),
      or transfer (xenologs). Function and sequence similarity are
      irrelevant to this classification.


fill_in_blank:
  - question: >
      Poor taxon sampling can cause ___ branch attraction, create
      artificial ___ groups, and reduce ___ signal in the alignment.
    answers:
      - "long"
      - "monophyletic (clade)"
      - "phylogenetic"

  - question: >
      ___ characters share common ancestry. ___ characters share
      function but have different evolutionary origins.
    answers:
      - "Homologous"
      - "Analogous"

  - question: >
      ___ genes arose by speciation and track the species tree.
      ___ genes arose by duplication and may conflict with it.
      ___ genes arose by horizontal gene transfer.
    answers:
      - "Orthologous"
      - "Paralogous"
      - "Xenologous"

  - question: >
      ___ paralogs arose by duplication AFTER a speciation event
      (lineage-specific). ___ paralogs arose by duplication BEFORE
      a speciation event (ancestral duplication).
    answers:
      - "In"
      - "Out"

  - question: >
      An ___ is a group of homologous genes descending from the
      ___ of a set of species. It is always defined by a reference
      ___ event.
    answers:
      - "orthogroup"
      - "MRCA (most recent common ancestor)"
      - "speciation"

  - question: >
      RBH stands for Reciprocal ___ Hit. Gene A and gene X are RBH
      if A's best hit is X AND X's best hit is ___. This requires
      an all-vs-all ___ search.
    answers:
      - "Best"
      - "A"
      - "BLAST"

  - question: >
      The biggest limitation of RBH is that it fails to detect
      ___-to-___ or ___-to-___ ortholog relationships.
    answers:
      - "one"
      - "many"
      - "many"
      - "many"

  - question: >
      In phylogenetics, ___ copy orthogroups are traditionally
      preferred because they unambiguously reflect the ___ tree.
    answers:
      - "single (one-to-one)"
      - "species"

  - question: >
      Transcriptomes cost approximately €___–___ per sample and
      produce ___ of genes. Chromosome-level genomes cost
      €___–___ and produce ___ of genes.
    answers:
      - "250"
      - "500"
      - "thousands"
      - "10,000"
      - "20,000"
      - "thousands"

  - question: >
      Mitochondrial genomes are useful for ___ and moderate
      divergences but problematic at deep divergences due to
      ___ caused by their high substitution rate.
    answers:
      - "shallow"
      - "saturation (homoplasy)"

  - question: >
      RADseq and GBS only produce short ___ markers, making
      them suitable only for ___ genomics or very closely
      related species — no proper ___ inference is possible.
    answers:
      - "SNP"
      - "population"
      - "orthology"
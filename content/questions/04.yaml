# LESSON 04 — Orthology Inference and Taxon Sampling

oral:
  - q: >
      What is the difference between an ortholog, a paralog, and a xenolog?
      Which category is preferred for species tree inference and why?
    a: |
      Orthologs are genes in different species whose most recent common ancestor
      is a speciation event. Because their divergence tracks species divergence,
      their gene tree is expected to match the species tree — making them the
      primary markers for phylogenetic inference.
      Paralogs are genes whose most recent common ancestor is a gene duplication
      event. They can exist within the same genome (in-paralogs) or across species
      (out-paralogs). Because their divergence predates or postdates a given
      speciation event, they do not necessarily reflect species relationships and
      can mislead inference.
      Xenologs are genes whose most recent common ancestor is a horizontal gene
      transfer event. They reflect transfer history rather than descent and can
      also confound species tree estimation, especially in prokaryotes.
      The unifying principle: the category is defined not by sequence similarity
      but by the nature of the evolutionary mechanism — speciation, duplication,
      or transfer — at the most recent common ancestor.
      Orthologs are preferred because only speciation-derived genes track the
      species tree. As Fitch (1970) stated: "Phylogenies require orthologous,
      not paralogous, genes."

  - q: >
      Explain what an orthogroup is, how it differs from a simple ortholog pair,
      and why it is always defined relative to a reference speciation event.
    a: |
      An ortholog pair is defined pairwise between two species: two genes whose
      MRCA is a speciation event. However, when considering multiple species
      simultaneously, pairwise comparisons are insufficient because they cannot
      capture many-to-many relationships across lineages.
      An orthogroup is a group of homologous genes descending from the MRCA of
      a defined group of species. It extends the concept of orthology to multiple
      species and accommodates gene duplications and losses within the group.
      Critically, an orthogroup is always defined by a reference speciation event:
      changing the species set changes the orthogroup boundaries. For example,
      two genes that are in-paralogs within a single clade may be orthologs when
      compared to a more distantly related outgroup.
      In phylogenomics, we typically work with single-copy orthogroups — those
      retaining one copy per species — to avoid including paralogous copies that
      would mislead tree inference.

  - q: >
      Describe the Reciprocal Best Hit (RBH) method for ortholog inference.
      What is its main strength and its most important limitation?
    a: |
      RBH identifies orthologs between two genomes through bidirectional
      comparison. First, every gene in species A is queried against the entire
      genome of species B and the best hit is recorded by e-value or bit score.
      Then the process is reversed: every gene in species B is queried against
      species A. A gene pair is called an ortholog only if each gene is the other's
      best hit in both directions.
      The bidirectionality is critical: without it, a gene lost in one species could
      incorrectly map to a paralog, generating false ortholog calls.
      Main strength: RBH is simple, fast, and scales easily to large genomes.
      Main limitation: RBH fundamentally fails to detect one-to-many and
      many-to-many ortholog relationships. In a case where a single gene in
      species A corresponds to two duplicated copies in species B, RBH picks only
      one of the two — the other is discarded. This means in-paralog relationships
      are systematically ignored, and the resulting orthogroup inference is
      incomplete.

  - q: >
      What is the orthology conjecture, and why has it been challenged?
      What is the practical implication for phylogenomics?
    a: |
      The orthology conjecture, proposed by Nehrt et al. (2011), states that
      orthologous genes are expected to share the same biological function,
      while paralogous genes are expected to differ in function — because
      after speciation, orthologs remain under the same selective constraints,
      whereas duplicated paralogs are free to subfunctionalize or neofunctionalize.
      It has been substantially challenged: studies by Stamboulian et al. (2020),
      Lynch and Conery (2000), and Gout and Lynch (2015) showed that many
      orthologs differ in function between species, and some paralogs retain
      identical function. The correlation between orthology and functional
      equivalence is imperfect.
      The practical implication for phylogenomics is that ortholog classification
      must be based strictly on the mechanism of origin — speciation — not on
      inferred function. Function should not be used as a proxy for orthology,
      as it introduces circular reasoning and biological noise into the inference.

  - q: >
      What are the main consequences of incomplete or biased taxon sampling
      in phylogenomics? What are the recommended practices to mitigate them?
    a: |
      Long branch attraction (LBA): distantly related taxa with long branches
      cluster erroneously due to missing intermediate taxa that would otherwise
      break up the branches and reduce convergent substitutions.
      Artificial clade resolution: missing taxa can create misleading monophyletic
      groups that reflect absence of data rather than true evolutionary history.
      Loss of phylogenetic signal: sparse sampling reduces the number of
      informative sites, leading to unresolved or poorly supported relationships.
      Model inadequacy: missing intermediate taxa skew branch length estimates
      and substitution rate distributions, biasing divergence time inference.
      Mitigation strategies:
      — Ensure broad and representative taxon sampling to break up long branches
        and reduce the probability of convergent substitutions being misread.
      — Include appropriate outgroups and intermediate lineages.
      — Use substitution models that account for rate heterogeneity (e.g. GTR+Γ).
      — Apply diagnostic tools to detect LBA before interpreting final topologies.


mcq:
  # — Orthology / paralogy / xenology —
  - question: >
      Two genes in different species share a common ancestor that is a
      gene duplication event predating the speciation of those species.
      These genes are best described as:
    options:
      - text: One-to-one orthologs
        correct: false
      - text: Out-paralogs
        correct: true
      - text: In-paralogs
        correct: false
      - text: Xenologs
        correct: false
    explanation: |
      Out-paralogs are paralogous genes whose most recent common ancestor is
      a duplication event that occurred BEFORE the speciation event separating
      the two species. Their divergence therefore predates the speciation, so
      they do not track the species tree. In-paralogs arise from duplications
      AFTER the relevant speciation event and are restricted to one lineage.
      Orthologs require a speciation event as the MRCA; xenologs require a
      transfer event.

  - question: >
      A researcher performs an all-vs-all BLAST between species A and B.
      GeneX in A hits GeneY in B as its best hit. GeneY in B hits GeneZ in A
      as its best hit. What does RBH conclude about GeneX and GeneY?
    options:
      - text: GeneX and GeneY are orthologs
        correct: false
      - text: GeneX and GeneY are NOT reciprocal best hits and are not called orthologs
        correct: true
      - text: GeneX and GeneY are paralogs
        correct: false
      - text: GeneX and GeneY are xenologs
        correct: false
    explanation: |
      RBH requires that each gene is the best hit of the other in both
      directions. Here, GeneX's best hit in B is GeneY, but GeneY's best hit
      in A is GeneZ — not GeneX. The reciprocity fails, so RBH does not call
      them orthologs. This illustrates how gene duplication in one genome can
      prevent correct pairwise ortholog identification.

  - question: >
      Why does traditional phylogenomics focus specifically on single-copy
      orthogroups rather than multi-copy gene families?
    options:
      - text: Multi-copy genes evolve too slowly to be informative
        correct: false
      - text: Single-copy orthogroups guarantee that each species contributes
          exactly one gene, avoiding paralogy-driven conflict in tree inference
        correct: true
      - text: Gene families are only found in prokaryotes
        correct: false
      - text: Multi-copy genes are always xenologs
        correct: false
    explanation: |
      If a gene family contains duplicated copies within a species, including
      all copies in a phylogenomic matrix risks mixing orthologous and
      paralogous signals. Single-copy orthogroups — one copy per species —
      ensure that the gene tree topology is expected to match the species tree.
      Multi-copy gene families are increasingly used in modern approaches,
      but require careful handling to separate the paralogous from orthologous
      signal.

  - question: >
      Which of the following correctly distinguishes in-paralogs from
      out-paralogs?
    options:
      - text: In-paralogs arose before a speciation event; out-paralogs after
        correct: false
      - text: In-paralogs arose after a speciation event and are restricted to
          one lineage; out-paralogs arose before and span multiple lineages
        correct: true
      - text: In-paralogs are found only in plants; out-paralogs only in animals
        correct: false
      - text: In-paralogs and out-paralogs are both orthologs relative to
          the speciation event
        correct: false
    explanation: |
      The in/out distinction is relative to a given speciation event.
      In-paralogs: duplicated after the speciation — found in only one
      descendent lineage, recently diverged from each other.
      Out-paralogs: duplicated before the speciation — present in both
      descendent lineages, diverged earlier than the speciation event.
      Out-paralogs are more problematic for phylogenomics because they
      appear in all sampled species and can mimic orthology relationships.

  # — Sequencing strategies —
  - question: >
      A research group needs to resolve the phylogeny of 200 species of
      beetles using the cheapest possible method. Which sequencing strategy
      is most appropriate, and what is its main limitation?
    options:
      - text: Chromosome-level genome sequencing; limitation is cost
        correct: false
      - text: RAD-Seq or GBS; limitation is that only SNPs are generated —
          no full genes — restricting analyses to closely related species
        correct: true
      - text: Transcriptome sequencing; limitation is that it requires
          chromosome-level assemblies as reference
        correct: false
      - text: UCE capture; limitation is that it requires fresh frozen tissue
        correct: false
    explanation: |
      RAD-Seq and GBS are the cheapest options (~€50–300 per sample) and
      do not require a reference genome. However, they generate only short
      SNPs — not full gene sequences — making them appropriate only for
      population genomics or phylogenomics of closely related species where
      gene-level resolution is unnecessary. For deep divergences, saturation
      in short markers and lack of orthology inference are critical problems.

  - question: >
      A researcher wants to sequence specimens from a natural history museum
      fixed in ethanol decades ago. Which strategy is LEAST suitable?
    options:
      - text: Draft genome sequencing
        correct: false
      - text: UCE capture sequencing
        correct: false
      - text: RAD-Seq
        correct: false
      - text: Chromosome-level genome sequencing
        correct: true
    explanation: |
      Chromosome-level genome assembly requires high-molecular-weight DNA
      from fresh or cryopreserved tissue. Ethanol-fixed museum specimens
      yield highly fragmented DNA that is incompatible with long-read
      sequencing technologies needed for chromosome-level assembly. Draft
      genomes, UCEs, and RAD-Seq can tolerate more degraded DNA and are
      viable with museum material, though quality varies.

  - question: >
      Compared to transcriptomes, whole genomes offer which key advantage
      for ortholog inference?
    options:
      - text: They are cheaper and faster to produce
        correct: false
      - text: They provide better identification of full-length genes with
          fewer chimeric sequences and no missing data from unexpressed genes
        correct: true
      - text: They do not require annotation
        correct: false
      - text: They eliminate all paralogs automatically
        correct: false
    explanation: |
      Transcriptomes represent only expressed genes at the moment of sampling
      — genes not expressed in that tissue or condition are absent, generating
      missing data. They are also prone to chimeric transcripts from misassembly
      of similar paralogs. Genomes capture all genes regardless of expression,
      provide full-length sequences, and are less prone to chimerism. The
      trade-off is cost and annotation complexity.

  - question: >
      Which of the following correctly describes a limitation of UCEs
      (Ultraconserved Elements) compared to transcriptomes?
    options:
      - text: UCEs require fresh tissue whereas transcriptomes do not
        correct: false
      - text: UCEs are limited to the markers designed a priori and cannot
          recover new or unexpected loci
        correct: true
      - text: UCEs cannot be used with museum specimens
        correct: false
      - text: UCEs are more expensive than transcriptomes
        correct: false
    explanation: |
      UCE capture relies on a predefined set of probes targeting conserved
      genomic regions. No marker outside those probes can be recovered — the
      approach is closed. This is unlike transcriptomes or genomes, which
      capture the full expressed or genomic content. UCEs also lack proper
      orthology inference pipelines and can have misassembly issues if probes
      were designed from few reference species. Their key advantages are cost
      (~€75–100), independence from a reference genome, and compatibility with
      museum and ethanol-fixed specimens.

  # — Taxon sampling biases —
  - question: >
      Long branch attraction (LBA) occurs when:
    options:
      - text: Very short branches in a tree attract each other due to
          shared ancestral characters
        correct: false
      - text: Distantly related taxa with high substitution rates cluster
          erroneously because convergent substitutions mimic shared ancestry
        correct: true
      - text: Missing taxa cause outgroups to nest inside the ingroup
        correct: false
      - text: Bootstrap support values are inflated by insufficient data
        correct: false
    explanation: |
      LBA is a systematic artifact caused by unequal substitution rates across
      lineages. Long branches accumulate many substitutions, and by chance
      some positions converge on the same state independently. Parsimony and
      model-violating analyses mistake these convergent substitutions for
      synapomorphies, pulling long branches together regardless of true
      ancestry. Adding intermediate taxa that break up long branches, or using
      better-fitting models like GTR+Γ or CAT, mitigates LBA.

  - question: >
      A student removes all taxa with more than 50% missing data from their
      matrix before analysis. What unintended consequence might this cause?
    options:
      - text: The tree will always become more resolved
        correct: false
      - text: Long branches may emerge as intermediate taxa are removed,
          potentially increasing the risk of LBA and reducing phylogenetic signal
        correct: true
      - text: The molecular clock assumption is automatically satisfied
        correct: false
      - text: Paralogs are automatically excluded
        correct: false
    explanation: |
      Taxa with high missing data are often those with fewer sequenced genes —
      but they may be phylogenetically critical intermediate lineages. Removing
      them can elongate the branches of their neighbors, increasing substitution
      rate contrasts and making LBA more likely. Missing data per se is less
      damaging than missing taxa: modern ML and BI methods handle missing
      data well, while the absence of key taxa permanently distorts topology.

  # — Sequencing types —
  - question: >
      Metagenomics differs from single-cell genomics and bulk sequencing in that:
    options:
      - text: It sequences DNA from a single cell only
        correct: false
      - text: It sequences DNA from multiple organisms within an environmental
          sample without prior isolation of individual organisms
        correct: true
      - text: It sequences RNA rather than DNA
        correct: false
      - text: It is exclusively used for bacterial phylogenomics
        correct: false
    explanation: |
      Metagenomics sequences all DNA present in an environmental sample
      (soil, seawater, gut content) from multiple organisms simultaneously,
      without culturing or isolating individual organisms. Bulk sequencing
      sequences DNA from multiple cells of one organism. Single-cell genomics
      sequences the genome of a single cell. All three are distinct experimental
      designs with different applications in phylogenomics.


fill_in_blank:
  - question: >
      Genes related by a speciation event are called _______________, while
      genes related by a duplication event are called _______________, and
      genes related by a horizontal transfer event are called _______________.
    answers:
      - "orthologs"
      - "paralogs"
      - "xenologs"

  - question: >
      An orthogroup is a group of homologous genes descending from the _______________
      of a defined group of species. It is always defined relative to a reference
      _______________ event.
    answers:
      - "most recent common ancestor (MRCA)"
      - "speciation"

  - question: >
      In Reciprocal Best Hit, two genes are called orthologs only if each gene
      is the other's _______________ in _______________ directions. The main
      limitation of this approach is that it fails to detect _______________
      ortholog relationships.
    answers:
      - "best hit (top BLAST hit)"
      - "both"
      - "one-to-many or many-to-many"

  - question: >
      Paralogs that arose from a duplication event BEFORE a speciation event are
      called _______________, while those arising AFTER the speciation event and
      restricted to one lineage are called _______________.
    answers:
      - "out-paralogs"
      - "in-paralogs"

  - question: >
      The orthology conjecture proposed that orthologous genes share the same
      _______________, while paralogous genes differ in _______________. This
      has been largely _______________ by subsequent studies.
    answers:
      - "biological function"
      - "function"
      - "challenged / questioned"

  - question: >
      The four main consequences of incomplete taxon sampling are:
      _______________ attraction, artificial _______________ resolution,
      loss of _______________ signal, and model _______________.
    answers:
      - "long branch"
      - "clade"
      - "phylogenetic"
      - "inadequacy"

  - question: >
      RAD-Seq costs approximately _______________ per sample and generates only
      _______________ rather than full gene sequences, making it suitable only
      for _______________ or closely related species comparisons.
    answers:
      - "€100–300"
      - "SNPs (short markers)"
      - "population genomics"

  - question: >
      The statement 'Phylogenies require _______________, not _______________
      genes' was made by Walter M. Fitch in _______________.
    answers:
      - "orthologous"
      - "paralogous"
      - "1970"
oral:
  - q: What are distance-based phylogenetic methods based on?
    a: >
      Pairwise differences between sequences. They count how many
      characters differ between each pair of aligned sequences and
      summarize these in a distance matrix.

  - q: Name the two main distance-based methods and their key difference.
    a: >
      UPGMA produces a rooted, ultrametric tree and assumes a constant
      molecular clock. Neighbor Joining (NJ) produces an unrooted tree
      and does NOT assume a molecular clock.

  - q: What does UPGMA stand for and what kind of tree does it produce?
    a: >
      Unweighted Pair Group Method with Arithmetic Mean. It produces a
      rooted, ultrametric tree where all tips are equidistant from the root.

  - q: Describe the UPGMA algorithm in three steps.
    a: >
      (1) Build a pairwise distance matrix. (2) Merge the pair with the
      smallest distance into a cluster. (3) Recalculate distances from
      the new cluster to all remaining taxa as the average of the two
      original distances. Repeat until one cluster remains.

  - q: What is the key difference between how UPGMA and NJ select the next pair to merge?
    a: >
      UPGMA merges the pair with the smallest raw distance. NJ first
      corrects for the overall divergence of each taxon (the Q-matrix)
      and merges the pair with the most negative Q-value — accounting
      for rate variation across lineages.

  - q: What is the Q-matrix in NJ and why is it needed?
    a: >
      The Q-matrix corrects raw distances by the net divergence (R) of
      each taxon from all others. This adjustment accounts for unequal
      substitution rates, preventing fast-evolving taxa from being
      incorrectly grouped together.

  - q: What are character-based phylogenetic methods and why are they more accurate than distance-based?
    a: >
      They evaluate each character (nucleotide or amino acid position)
      individually and incorporate explicit evolutionary models. This
      makes them more accurate than distance-based methods, which
      compress all information into a single pairwise number.

  - q: What is the principle of Maximum Parsimony?
    a: >
      Reconstruct the tree that requires the fewest total evolutionary
      changes (substitutions) to explain the observed data.

  - q: What makes a site parsimony-informative?
    a: >
      It must have at least two different character states, and each
      state must appear in at least two taxa. Sites that are invariant
      or have a state present in only one taxon (singletons) are not
      informative.

  - q: What is the main weakness of Maximum Parsimony?
    a: >
      It has no proper statistical model and does not correct for
      multiple substitutions. It is sensitive to homoplasy and can
      give wrong results with long branches (Long Branch Attraction).

  - q: What are the three tree rearrangement methods used to explore tree space?
    a: >
      NNI (Nearest Neighbour Interchange) — swaps two neighbouring
      subtrees around one internal branch; fast but may get stuck
      locally. SPR (Subtree Pruning and Regrafting) — prunes and
      reattaches a subtree elsewhere. TBR (Tree Bisection and
      Reconnection) — cuts the tree in two and reconnects any two
      branches; most thorough.

  - q: Why can we not simply score every possible tree topology?
    a: >
      The number of possible trees grows exponentially with the number
      of taxa — it becomes computationally impossible. Tree rearrangement
      heuristics are used to explore the tree space efficiently instead.

  - q: Which tree rearrangement method is fastest but most likely to get stuck in a local optimum?
    a: >
      NNI (Nearest Neighbour Interchange), because it only makes small
      local changes — swapping two neighbouring subtrees around one
      internal branch — and explores a very limited neighbourhood.

  - q: Which tree rearrangement method explores the largest area of tree space?
    a: >
      TBR (Tree Bisection and Reconnection), because it cuts the tree
      into two large subtrees and can reconnect any branch of one to
      any branch of the other — exploring the widest set of alternatives.

  - q: What is the main practical use of distance-based methods today?
    a: >
      Fast exploratory analysis of large datasets before running more
      accurate but computationally intensive character-based methods
      like Maximum Likelihood or Bayesian Inference.


mcq:
  - question: "Distance-based phylogenetic methods use:"
    options:
      - text: Pairwise differences between sequences in a distance matrix
        correct: true
      - text: Character-by-character evaluation with an evolutionary model
        correct: false
      - text: The minimum number of substitutions to explain the data
        correct: false
      - text: Bayesian probability distributions over tree topologies
        correct: false
    explanation: >
      Distance-based methods compress sequence information into pairwise
      differences, stored in a distance matrix. They do not evaluate
      individual characters or use explicit evolutionary models.

  - question: "UPGMA assumes:"
    options:
      - text: A constant molecular clock across all lineages in the tree
        correct: true
      - text: Different lineages can evolve at very different rates freely
        correct: false
      - text: The tree must be unrooted and lacks a temporal dimension
        correct: false
      - text: Branch lengths are estimated using a Q-matrix correction
        correct: false
    explanation: >
      UPGMA assumes a strict molecular clock — all lineages evolve at
      the same constant rate. This is why it produces an ultrametric
      tree (all tips equidistant from the root).

  - question: What type of tree does UPGMA produce?
    options:
      - text: Rooted and ultrametric (all tips equidistant from root)
        correct: true
      - text: Unrooted with branch lengths reflecting rate variation
        correct: false
      - text: Rooted but with tips at very different depths in the tree
        correct: false
      - text: Unrooted and ultrametric with no branch length estimates
        correct: false
    explanation: >
      Because UPGMA assumes a constant clock, all lineages accumulate
      the same amount of change per unit time, making all tips
      equidistant from the root — an ultrametric tree.

  - question: "NJ differs from UPGMA because NJ:"
    options:
      - text: Does not assume a molecular clock and gives unrooted trees
        correct: true
      - text: Assumes a strict molecular clock and gives rooted trees
        correct: false
      - text: Uses character states directly rather than pairwise distances
        correct: false
      - text: Requires more computation time than Bayesian inference does
        correct: false
    explanation: >
      NJ allows different lineages to evolve at different rates (no clock
      assumption) and produces an unrooted tree. It uses the Q-matrix
      to correct for rate variation before merging pairs.

  - question: "In NJ, the Q-matrix is used to:"
    options:
      - text: Correct raw distances for the overall divergence of each taxon
        correct: true
      - text: Calculate the exact branch length from root to each tip
        correct: false
      - text: Average distances between clusters as in UPGMA arithmetic
        correct: false
      - text: Count the number of parsimony-informative sites per pair
        correct: false
    explanation: >
      The Q-matrix adjusts raw pairwise distances by subtracting the
      net divergence (R) of each taxon, correcting for taxa that are
      generally fast-evolving and would otherwise be incorrectly grouped.

  - question: "When NJ merges the most negative Q-value pair, the new cluster distance to other taxa is calculated using:"
    options:
      - text: The average of distances from both original taxa to each other
        correct: true
      - text: The maximum of the two original distances to that taxon
        correct: false
      - text: The Q-value of the merged pair divided by taxon number
        correct: false
      - text: The same formula as UPGMA — arithmetic mean of distances
        correct: false
    explanation: >
      NJ uses the formula: d(U,X) = [d(A,X) + d(B,X) − d(A,B)] / 2,
      which accounts for the distance between the merged taxa themselves,
      unlike UPGMA which simply averages the two distances.

  - question: "Character-based methods are more accurate than distance-based because they:"
    options:
      - text: Evaluate each site individually using explicit evolutionary models
        correct: true
      - text: Run faster and scale better to very large datasets overall
        correct: false
      - text: Require no assumptions about how sequences evolve over time
        correct: false
      - text: Use only pairwise distances corrected by the Q-matrix method
        correct: false
    explanation: >
      Character-based methods consider each alignment position separately
      and apply evolutionary models — preserving more information than
      collapsing everything into a single pairwise distance.

  - question: "Maximum Parsimony selects the tree that:"
    options:
      - text: Requires the fewest total substitutions to explain the data
        correct: true
      - text: Has the highest probability given the substitution model
        correct: false
      - text: Maximizes the average pairwise distance between all taxa
        correct: false
      - text: Groups taxa with the most similar base composition together
        correct: false
    explanation: >
      Parsimony applies Occam's razor — the simplest explanation (fewest
      changes) is preferred. It counts the minimum number of substitutions
      required on each tree and selects the tree with the lowest total.

  - question: "A parsimony-informative site must have:"
    options:
      - text: At least two states, each present in at least two taxa
        correct: true
      - text: Only one character state present across all taxa in data
        correct: false
      - text: A unique state found in exactly one taxon (singleton here)
        correct: false
      - text: All four nucleotides represented at least once in column
        correct: false
    explanation: >
      Informative sites must have at least two different states AND
      each state must appear in at least two taxa — otherwise the site
      cannot help distinguish between alternative tree topologies.

  - question: "A site where one character state appears in only one taxon is called:"
    options:
      - text: A singleton — it is not parsimony-informative at all
        correct: true
      - text: A synapomorphy — it supports a specific grouping of taxa
        correct: false
      - text: An informative site — it helps resolve tree topology here
        correct: false
      - text: A homoplasy — it arose independently in two lineages here
        correct: false
    explanation: >
      A singleton has a unique state in only one taxon. It cannot
      favor one tree over another — any topology has the same parsimony
      score for that site — so it adds no information.

  - question: "A key weakness of Maximum Parsimony is:"
    options:
      - text: It has no proper model and ignores multiple substitutions
        correct: true
      - text: It is too slow to be used on any real biological dataset
        correct: false
      - text: It always produces rooted trees with a molecular clock
        correct: false
      - text: It requires a full distance matrix as its starting input
        correct: false
    explanation: >
      Parsimony does not correct for multiple hits at the same site
      and has no statistical model of evolution. This makes it sensitive
      to homoplasy and Long Branch Attraction.

  - question: "NNI (Nearest Neighbour Interchange) works by:"
    options:
      - text: Swapping two subtrees around one internal branch at a time
        correct: true
      - text: Cutting a subtree and regrafting it anywhere in the tree
        correct: false
      - text: Splitting the tree in two and reconnecting any two branches
        correct: false
      - text: Randomly generating new trees from scratch each iteration
        correct: false
    explanation: >
      NNI is the most local rearrangement — it takes one internal branch,
      identifies the four surrounding subtrees, and swaps two of them.
      Fast but prone to local optima.

  - question: "SPR (Subtree Pruning and Regrafting) differs from NNI because it:"
    options:
      - text: Moves an entire subtree to a new position anywhere in tree
        correct: true
      - text: Only swaps two immediate neighbours around one branch here
        correct: false
      - text: Cuts the whole tree into two halves and rejoins any branches
        correct: false
      - text: Evaluates every possible topology without any heuristics
        correct: false
    explanation: >
      SPR prunes a subtree from its current position and regrafts it
      at a different location in the tree — a larger move than NNI
      but less exhaustive than TBR.

  - question: "TBR (Tree Bisection and Reconnection) explores the largest tree space because:"
    options:
      - text: It cuts the tree in two and can reconnect any pair of branches
        correct: true
      - text: It only swaps two subtrees adjacent to one internal branch
        correct: false
      - text: It uses the Q-matrix to guide which branches to reconnect
        correct: false
      - text: It evaluates all possible trees before selecting the best
        correct: false
    explanation: >
      TBR cuts the tree into two large subtrees and can rejoin any branch
      of one with any branch of the other — this explores far more
      topologies per step than NNI or SPR.

  - question: Which statement correctly summarizes UPGMA vs NJ?
    options:
      - text: UPGMA assumes a clock and roots the tree; NJ does neither
        correct: true
      - text: NJ assumes a clock and roots the tree; UPGMA does neither
        correct: false
      - text: Both assume a clock but produce different root positions
        correct: false
      - text: Both are character-based and use substitution models here
        correct: false
    explanation: >
      UPGMA assumes a constant molecular clock and produces a rooted
      ultrametric tree. NJ does not assume a clock and produces an
      unrooted tree — making NJ more flexible for real data.


fill_in_blank:
  - question: >
      Distance-based methods summarize pairwise differences in a
      ___ matrix. They are best used today for ___ analysis before
      running character-based methods.
    answers:
      - "distance"
      - "exploratory"

  - question: >
      UPGMA produces a ___ and ___ tree, assuming a constant
      ___ clock. NJ produces an ___ tree and makes no clock assumption.
    answers:
      - "rooted"
      - "ultrametric"
      - "molecular"
      - "unrooted"

  - question: >
      In UPGMA, the distance from a new cluster (A,B) to taxon C is
      calculated as the ___ of d(A,C) and d(B,C).
    answers:
      - "average (arithmetic mean)"

  - question: >
      In NJ, instead of merging the pair with the smallest raw distance,
      the ___ matrix is first computed to correct for the overall ___
      of each taxon from all others.
    answers:
      - "Q"
      - "divergence (net divergence, R)"

  - question: >
      Character-based methods evaluate one ___ at a time and
      incorporate explicit ___ models, making them more accurate
      than distance-based methods.
    answers:
      - "character (site)"
      - "evolutionary (substitution)"

  - question: >
      Maximum Parsimony selects the tree with the ___ total number
      of evolutionary ___. It uses only ___ sites.
    answers:
      - "fewest (minimum)"
      - "changes (substitutions)"
      - "parsimony-informative"

  - question: >
      A parsimony-informative site must have at least ___ different
      character states, and each state must appear in at least ___
      taxa. A site with a state in only one taxon is a ___.
    answers:
      - "two"
      - "two"
      - "singleton"

  - question: >
      Two weaknesses of Maximum Parsimony are: it has no proper
      ___ model, and it does not correct for ___ substitutions
      at the same site.
    answers:
      - "statistical (evolutionary)"
      - "multiple"

  - question: >
      The three tree rearrangement methods in order of increasing
      thoroughness are: ___ (swap neighbours), ___ (prune and
      regraft a subtree), and ___ (bisect and reconnect any branches).
    answers:
      - "NNI"
      - "SPR"
      - "TBR"

  - question: >
      NNI is the ___ but most likely to get stuck in a ___ optimum.
      TBR explores the ___ area of tree space.
    answers:
      - "fastest"
      - "local"
      - "largest"
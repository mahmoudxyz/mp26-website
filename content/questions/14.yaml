oral:
  - q: What does the molecular clock hypothesis state?
    a: >
      That genetic changes accumulate at a roughly constant rate over time,
      allowing divergence times to be estimated from genetic distance.

  - q: What is the divergence time formula and what does each term mean?
    a: >
      Time = Distance / (2 × rate). Distance is the number of substitutions
      between two sequences; rate is the substitution rate per site per year;
      the factor 2 accounts for mutations accumulating along both lineages
      since the common ancestor.

  - q: Give two reasons why the strict molecular clock is often violated.
    a: >
      (1) Generation time — organisms with shorter generations replicate DNA
      more often per year, accumulating more mutations. (2) Variation in
      selective pressure — positive selection accelerates substitution rate,
      purifying selection slows it down.

  - q: What is a strict molecular clock?
    a: >
      A model assuming one constant substitution rate across all lineages.
      All tips are equidistant from the root (ultrametric tree).

  - q: What is a local molecular clock?
    a: >
      A model where different predefined clades each evolve at their own
      constant rate — a middle ground between strict (one rate) and relaxed
      (per-branch rates).

  - q: What distinguishes an uncorrelated from an autocorrelated relaxed clock?
    a: >
      Uncorrelated — each branch draws its rate independently from a
      distribution; parent and daughter can differ greatly. Autocorrelated —
      daughter branches inherit rates similar to their parent, modeling
      gradual rate drift along the tree.

  - q: What is node dating?
    a: >
      Fossils are used to constrain the ages of internal nodes in a tree
      built from living taxa. Each fossil provides a minimum age for the
      node where it is placed.

  - q: What is tip dating and what is its key advantage?
    a: >
      Fossils are included as terminal taxa; their stratigraphic age dates
      the tip directly. The advantage is that it avoids the difficult
      crown vs stem assignment problem required in node dating.

  - q: Define crown group and stem group.
    a: >
      Crown group — all living members of a clade plus their most recent
      common ancestor and all descendants. Stem group — extinct lineages
      more closely related to the crown than to any other group, but
      outside the crown itself.

  - q: Why is misplacing a stem fossil as a crown calibration a problem?
    a: >
      It gives a minimum crown age that is too young — the real crown
      divergence happened before the stem fossil existed, so the estimate
      is biased toward the present.

  - q: What does a fossil calibration provide — minimum or maximum age?
    a: >
      Always a minimum age. The fossil tells us the clade existed at least
      as far back as the fossil. The maximum is usually soft and harder
      to justify.

  - q: When would you choose an exponential vs lognormal fossil prior?
    a: >
      Exponential — when the fossil is believed to be close to the true
      divergence; probability peaks at the minimum and drops fast.
      Lognormal — when the divergence likely predated the fossil by some
      margin; probability is concentrated just above the minimum with a
      right tail toward older ages.

  - q: What three processes does the Fossilized Birth-Death (FBD) model explicitly include?
    a: >
      Speciation (birth), extinction (death), and fossil sampling
      (preservation and discovery). It allows fossils to be treated as
      terminal taxa rather than node constraints.

  - q: What is the main advantage of Bayesian dating over LSD?
    a: >
      Bayesian inference simultaneously estimates topology, rates, and
      dates — propagating uncertainty from all sources into credible
      intervals. LSD requires a fixed topology and does not propagate
      topological uncertainty.

  - q: When is LSD the most practical choice for divergence time analysis?
    a: >
      When the dataset is very large and a fast approximate result is
      needed. LSD requires fixed branch lengths and topology, is
      implemented in IQ-TREE, and scales to thousands of taxa.


mcq:
  - question: What does the molecular clock hypothesis allow us to do?
    options:
      - text: Estimate when two species diverged from a common ancestor
        correct: true
      - text: Predict which species will go extinct in the near future
        correct: false
      - text: Identify the geographic origin of a given population
        correct: false
      - text: Measure body size changes across evolutionary history
        correct: false
    explanation: >
      The molecular clock links genetic distance to time. Knowing the
      substitution rate, we can calculate when two lineages last shared
      a common ancestor using Time = Distance / (2 × rate).

  - question: "In the formula Time = Distance / (2 × rate), the factor 2 is there because:"
    options:
      - text: Mutations accumulate along both lineages after they split
        correct: true
      - text: DNA is double-stranded so both strands are always counted
        correct: false
      - text: Time is always measured in pairs of geological epochs here
        correct: false
      - text: The rate must be halved to correct for back-mutations only
        correct: false
    explanation: >
      After two lineages split, mutations accumulate independently on each
      branch. The total genetic distance therefore reflects changes in both
      lineages, hence the factor of 2.

  - question: Which scenario is MOST likely to violate a strict molecular clock?
    options:
      - text: Comparing two groups with very different generation times
        correct: true
      - text: Comparing two closely related species of the same genus
        correct: false
      - text: Using a neutral gene with no functional constraint at all
        correct: false
      - text: Analyzing specimens collected from the same population
        correct: false
    explanation: >
      Generation time is a major cause of rate variation — short-generation
      organisms undergo more DNA replications per year, accumulating more
      mutations and violating the clock assumption.

  - question: "A local molecular clock differs from a strict clock because:"
    options:
      - text: Different predefined clades can have their own constant rate
        correct: true
      - text: Every single branch gets its own independently drawn rate
        correct: false
      - text: Rates are randomly sampled from a probability distribution
        correct: false
      - text: It places calibrations on tips instead of internal nodes
        correct: false
    explanation: >
      A local clock is a middle ground — the tree is divided into predefined
      groups, each with its own constant rate, unlike a strict clock (one
      global rate) or a relaxed clock (per-branch rates).

  - question: In an uncorrelated relaxed clock, what is true about branch rates?
    options:
      - text: Each branch draws its own rate independently from a prior
        correct: true
      - text: Daughter branches always inherit the parent branch rate exactly
        correct: false
      - text: All branches share one rate estimated from the root only
        correct: false
      - text: Rates are fixed once at the start and never change again
        correct: false
    explanation: >
      In an uncorrelated relaxed clock, each branch independently samples its
      rate from a distribution (e.g. lognormal). Parent and daughter branches
      can have very different rates.

  - question: "In an autocorrelated relaxed clock, daughter branch rates tend to:"
    options:
      - text: Be similar to their parent's rate, modeling gradual drift
        correct: true
      - text: Be the exact opposite of the parent branch rate always
        correct: false
      - text: Be drawn completely independently with no phylogenetic link
        correct: false
      - text: Be equal to the global mean rate regardless of ancestry
        correct: false
    explanation: >
      Autocorrelated clocks model the biological reality that metabolic and
      life-history changes are heritable and gradual — daughter branches
      inherit rates close to their parent's rate.

  - question: In node dating, what does a fossil calibration provide for the node?
    options:
      - text: A minimum age — the clade must be at least that old
        correct: true
      - text: An exact age — the clade originated exactly at that time
        correct: false
      - text: A maximum age — the clade cannot be older than the fossil
        correct: false
      - text: A rate estimate for the branch leading to that node
        correct: false
    explanation: >
      Fossils are always minimums — a fossil's presence tells us the lineage
      existed at least that far back, but the true origin could be older.

  - question: "In tip dating, fossils are used as:"
    options:
      - text: Terminal taxa whose stratigraphic age directly dates the tip
        correct: true
      - text: Constraints applied only to the deepest root of the tree
        correct: false
      - text: Maximum age bounds placed on specific internal nodes here
        correct: false
      - text: Outgroups used to root the phylogeny of living species
        correct: false
    explanation: >
      Tip dating includes fossils as terminals in the tree. Their age dates
      the tip directly, and their phylogenetic position is inferred from
      morphological data — no crown vs stem decision is needed.

  - question: "The crown group of birds includes:"
    options:
      - text: All living birds and their most recent common ancestor
        correct: true
      - text: All extinct bird-like reptiles from the Mesozoic record
        correct: false
      - text: Every organism that ever evolved feathers in earth history
        correct: false
      - text: Only the earliest known bird species in the fossil record
        correct: false
    explanation: >
      The crown is defined by living members — all extant birds, their MRCA,
      and all descendants of that ancestor (including extinct lineages within
      the crown).

  - question: "Archaeopteryx is a stem bird. Using it to calibrate the crown bird node would make the crown age estimate:"
    options:
      - text: Too young — biased toward the present
        correct: true
      - text: Too old — biased toward more ancient times
        correct: false
      - text: More accurate — older fossils always improve calibrations
        correct: false
      - text: Unaffected — stem and crown fossils give the same result
        correct: false
    explanation: >
      Stem fossils are outside the crown. The crown divergence happened after
      the stem appeared. Using a stem fossil as a crown minimum gives an age
      that is younger than the true crown origin.

  - question: Which fossil calibration prior places the highest probability right at the minimum age?
    options:
      - text: Exponential — peaks at the minimum, drops off quickly
        correct: true
      - text: Lognormal — peaks just above minimum with a heavy tail
        correct: false
      - text: Uniform — flat probability between a minimum and maximum
        correct: false
      - text: Normal — bell-shaped and centered on a hypothesized mean
        correct: false
    explanation: >
      The exponential prior is appropriate when the fossil is expected to be
      a close approximation of the true divergence — it peaks at the minimum
      and declines rapidly for older ages.

  - question: Why is the lognormal prior preferred over uniform for most fossil calibrations?
    options:
      - text: It allows divergence to be older than the fossil with a tail
        correct: true
      - text: It assumes the divergence happened exactly at the fossil date
        correct: false
      - text: It requires no minimum age constraint from fossil evidence
        correct: false
      - text: It gives equal probability to all ages within fixed bounds
        correct: false
    explanation: >
      The lognormal places most probability just above the minimum (fossil age)
      with a right tail for older ages — biologically realistic because true
      divergence usually predated the first fossil by some unknown amount.

  - question: Which dating method is the fastest and best suited for very large trees?
    options:
      - text: LSD (Least Squares Dating), implemented in IQ-TREE software
        correct: true
      - text: Bayesian inference using BEAST with full MCMC integration
        correct: false
      - text: Penalized Maximum Likelihood using r8s or treePL software
        correct: false
      - text: Total-evidence dating with FBD model inside RevBayes here
        correct: false
    explanation: >
      LSD uses a fixed topology and branch lengths to apply a fast mathematical
      criterion. It scales to thousands of taxa and runs in seconds — ideal for
      large datasets where full Bayesian analysis is too slow.

  - question: "The main advantage of Bayesian divergence time inference is that it:"
    options:
      - text: Jointly estimates and propagates uncertainty across all parameters
        correct: true
      - text: Is the fastest method available for any size of dataset
        correct: false
      - text: Requires no fossil calibrations to estimate node ages
        correct: false
      - text: Always produces older estimates than likelihood-based methods
        correct: false
    explanation: >
      Bayesian inference simultaneously estimates topology, branch lengths,
      rates, and dates — propagating all uncertainty into credible intervals
      on node ages. This is its key strength over LSD and PML.

  - question: "The Fossilized Birth-Death (FBD) model explicitly models:"
    options:
      - text: Speciation, extinction, and fossil sampling as processes
        correct: true
      - text: Mutation rates, base composition, and substitution models
        correct: false
      - text: Geographic dispersal, vicariance, and gene flow events
        correct: false
      - text: Body size, metabolic rate, and generation time together
        correct: false
    explanation: >
      FBD models three processes: lineage birth (speciation), lineage death
      (extinction), and fossil sampling (preservation and discovery). This
      lets fossils be treated as tips rather than node constraints.


fill_in_blank:
  - question: Time = ___ / (2 × ___)
    answers:
      - "Distance"
      - "rate"

  - question: >
      The factor 2 in the clock formula exists because substitutions
      accumulate along ___ lineages since the common ancestor.
    answers:
      - "both"

  - question: >
      A ___ clock assumes one global rate. A ___ clock gives each
      predefined clade its own rate. A ___ clock allows rates to vary
      freely on every branch.
    answers:
      - "strict"
      - "local"
      - "relaxed"

  - question: >
      In an ___ relaxed clock, branch rates are drawn independently.
      In an ___ relaxed clock, daughter branches inherit rates similar
      to their parent.
    answers:
      - "uncorrelated"
      - "autocorrelated"

  - question: >
      Node dating constrains ___ node ages using fossils as ___
      age bounds. Tip dating includes fossils directly as ___ taxa.
    answers:
      - "internal"
      - "minimum"
      - "terminal"

  - question: >
      A fossil always gives a ___ age — it tells us the clade is at
      least ___ old as the fossil.
    answers:
      - "minimum"
      - "as"

  - question: >
      The ___ group contains all living members of a clade and their
      MRCA. The ___ group contains extinct lineages outside the crown.
    answers:
      - "crown"
      - "stem"

  - question: >
      Using a ___ fossil to calibrate a crown node makes the crown
      age too ___, biasing the estimate toward the present.
    answers:
      - "stem"
      - "young"

  - question: >
      The ___ prior peaks right at the minimum. The ___ prior has
      a right tail above the minimum. The ___ prior is flat between
      two bounds.
    answers:
      - "exponential"
      - "lognormal"
      - "uniform"

  - question: >
      LSD is implemented in ___. BEAST and RevBayes implement ___
      inference. The FBD model treats fossils as ___ rather than
      node constraints.
    answers:
      - "IQ-TREE"
      - "Bayesian"
      - "terminal taxa (tips)"

  - question: >
      The FBD model includes three processes: ___ (speciation),
      ___ (extinction), and ___ (fossil preservation and discovery).
    answers:
      - "birth"
      - "death"
      - "sampling"
oral:
  - q: What is a phylogenetic tree in terms of scientific certainty?
    a: >
      A hypothesis — it represents the best supported explanation of
      evolutionary relationships given the data and methods used, not
      a proven fact. Support metrics quantify how confident we can be.

  - q: Describe the non-parametric bootstrap in three steps.
    a: >
      (1) Randomly sample n columns with replacement from the original
      alignment of length n to create a bootstrapped alignment.
      (2) Infer a tree from that alignment using the same method.
      (3) Repeat many times — the bootstrap proportion (BP) is the
      percentage of replicates containing a given bipartition.

  - q: What does a bootstrap proportion (BP) actually measure?
    a: >
      The robustness of the phylogenetic signal — how consistently
      a branch appears across resampled datasets. It is NOT a direct
      probability that the branch is correct.

  - q: How does parametric bootstrap differ from non-parametric bootstrap?
    a: >
      Parametric bootstrap simulates new alignments using a substitution
      model and tree estimated from the real data, rather than resampling
      the original columns. Its values depend heavily on model correctness —
      a wrong model gives biased support values.

  - q: What problem does TBE (Transfer Bootstrap Expectation) solve?
    a: >
      Standard BP uses binary scoring — a branch is either fully present
      or absent in a replicate. With large trees, one misplaced taxon
      causes the entire branch to score as absent. TBE uses a gradual
      transfer distance, giving partial credit and producing more
      informative support on deep branches.

  - q: How does jackknife differ from bootstrap in its resampling approach?
    a: >
      Jackknife deletes a fixed proportion of columns (typically 50%)
      without replacement — sampling without replacement. Bootstrap
      resamples n columns with replacement, keeping the alignment
      the same length.

  - q: What does the aLRT measure and what is L2 in the formula?
    a: >
      The approximate Likelihood Ratio Test measures branch support
      as 2(L1 − L2), where L1 is the log-likelihood of the best tree
      and L2 is the log-likelihood of the second-best NNI rearrangement
      around that branch. A large difference means the branch is
      well-supported by the data.

  - q: What are Posterior Probabilities (PPs) in Bayesian phylogenetics?
    a: >
      The frequency with which a bipartition appears in trees sampled
      during the stationary phase of an MCMC chain. A PP of 0.95
      means the clade appeared in 95% of sampled trees. PPs tend
      to be higher than non-parametric bootstrap values.

  - q: What is the difference between gCF and sCF?
    a: >
      Gene Concordance Factor (gCF) — the proportion of individual
      gene trees that contain a specific branch. Site Concordance
      Factor (sCF) — the proportion of informative sites in the
      alignment that support a branch in the reference tree.

  - q: How do you interpret concordance factor values?
    a: >
      Above 70% — strong signal and high agreement across genes or
      sites. 40–70% — moderate support with possible discordance.
      Below 40% — weak support or substantial gene tree conflict.

  - q: Why should you compare multiple support metrics rather than relying on one?
    a: >
      Each metric has different assumptions and pitfalls — parametric
      methods depend on model correctness, PPs can be inflated, BPs
      can be conservative. Consistent results across different metrics
      give much more reliable support than any single metric alone.

  - q: What is one key limitation of aLRT?
    a: >
      It only evaluates local rearrangements around the branch of
      interest (the four adjacent branches). It may miss alternative
      topologies that are far from the current tree but have a higher
      likelihood.

  - q: Why do Posterior Probabilities tend to be higher than bootstrap proportions?
    a: >
      PPs integrate over uncertainty in all model parameters and can
      concentrate probability on well-supported clades very quickly.
      They are also sensitive to prior choice — if priors are
      informative, PPs can be inflated relative to BPs.

  - q: What proportion of sites does jackknife typically remove per replicate?
    a: >
      50% — half the alignment columns are randomly deleted without
      replacement, producing a shorter alignment for each replicate tree.


mcq:
  - question: "A phylogenetic tree is best described as:"
    options:
      - text: A hypothesis about evolutionary relationships in the data
        correct: true
      - text: A proven record of exactly how species are all related
        correct: false
      - text: A fixed map of evolution that does not need any support
        correct: false
      - text: A distance matrix summarizing pairwise sequence differences
        correct: false
    explanation: >
      Phylogenetic trees are hypotheses — they represent the best
      supported explanation given the data and model. Support metrics
      tell us how confident we can be in each branch of that hypothesis.

  - question: "In non-parametric bootstrapping, the resampled alignment is created by:"
    options:
      - text: Sampling n columns with replacement from the original alignment
        correct: true
      - text: Deleting 50% of columns randomly without any replacement
        correct: false
      - text: Simulating new sequences using the best-fit model and tree
        correct: false
      - text: Randomly shuffling taxa labels across the original alignment
        correct: false
    explanation: >
      Non-parametric bootstrap samples n columns with replacement —
      some columns may appear multiple times, others not at all.
      The resulting alignment is the same length as the original.

  - question: "A bootstrap proportion (BP) of 95% means:"
    options:
      - text: That branch appeared in 95% of the bootstrap replicate trees
        correct: true
      - text: There is a 95% probability that branch reflects true history
        correct: false
      - text: 95% of alignment sites support that specific branch directly
        correct: false
      - text: The branch has a likelihood ratio of 95 over the null model
        correct: false
    explanation: >
      BP is the percentage of bootstrap trees containing a given
      bipartition — it measures signal robustness, not a direct
      probability of correctness. This is a common misconception.

  - question: "Parametric bootstrap differs from non-parametric bootstrap because it:"
    options:
      - text: Simulates alignments from a model and tree fitted to the data
        correct: true
      - text: Resamples columns from the original alignment with replacement
        correct: false
      - text: Deletes half the alignment columns without any replacement
        correct: false
      - text: Uses MCMC sampling to generate posterior tree distributions
        correct: false
    explanation: >
      Parametric bootstrap fits a model and tree to the real data,
      then simulates replicate alignments under that model. If the
      model is wrong, support values will be biased.

  - question: "TBE (Transfer Bootstrap Expectation) was introduced because standard BP:"
    options:
      - text: Scores a branch as absent if even one taxon is misplaced
        correct: true
      - text: Tends to give values that are too low for shallow branches
        correct: false
      - text: Cannot be computed for trees with more than 100 taxa at all
        correct: false
      - text: Requires a molecular clock assumption to score each branch
        correct: false
    explanation: >
      Standard BP is binary — one misplaced rogue taxon in a large
      tree causes the whole branch to be scored as absent. TBE uses
      a gradual transfer distance that gives partial credit, producing
      more informative values on deep branches of large trees.

  - question: "Jackknife differs from bootstrap in that jackknife:"
    options:
      - text: Deletes a fixed proportion of columns without replacement
        correct: true
      - text: Resamples the same number of columns with replacement here
        correct: false
      - text: Simulates new alignments using a fitted substitution model
        correct: false
      - text: Uses MCMC chains to estimate the posterior of each branch
        correct: false
    explanation: >
      Jackknife samples WITHOUT replacement and removes a fixed
      fraction (typically 50%) of columns. Bootstrap samples WITH
      replacement, keeping alignment length the same.

  - question: "In aLRT, the support statistic 2(L1 − L2) uses L2 as:"
    options:
      - text: The log-likelihood of the second-best NNI rearrangement nearby
        correct: true
      - text: The log-likelihood of the tree with that branch collapsed here
        correct: false
      - text: The log-likelihood averaged over all possible NNI moves made
        correct: false
      - text: The log-likelihood of a random tree used as a null model
        correct: false
    explanation: >
      L2 in aLRT is the log-likelihood of the second-best NNI topology
      around the branch of interest — a fast local approximation that
      avoids the cost of computing a fully collapsed null model.

  - question: "A key limitation of aLRT is that it:"
    options:
      - text: Only evaluates local rearrangements around the tested branch
        correct: true
      - text: Requires hundreds of replicate trees, making it very slow
        correct: false
      - text: Can only be used with Bayesian inference, not maximum likelihood
        correct: false
      - text: Gives values that are always lower than bootstrap proportions
        correct: false
    explanation: >
      aLRT only considers the four branches adjacent to the branch
      of interest. It may miss distant topologies with higher likelihoods,
      potentially overestimating support in some cases.

  - question: "Posterior Probabilities (PPs) in Bayesian inference represent:"
    options:
      - text: How often a clade appears in trees sampled during the MCMC run
        correct: true
      - text: The percentage of bootstrap replicates containing that branch
        correct: false
      - text: The proportion of genes that support a branch in the tree
        correct: false
      - text: The likelihood ratio of the best tree versus the null model
        correct: false
    explanation: >
      PPs are the frequency of a bipartition in trees sampled at the
      stationary phase of the MCMC chain — ranging from 0 to 1, where
      0.95 means the clade appeared in 95% of sampled trees.

  - question: "Compared to non-parametric bootstrap, Posterior Probabilities tend to be:"
    options:
      - text: Higher — PPs can be inflated relative to bootstrap values
        correct: true
      - text: Lower — MCMC sampling is more conservative than bootstrapping
        correct: false
      - text: Identical — both measure the same aspect of branch support
        correct: false
      - text: More variable — PPs fluctuate more across different runs here
        correct: false
    explanation: >
      PPs consistently tend to be higher than non-parametric BPs.
      They are also sensitive to prior choice — informative priors
      can push PPs toward 1 even when support is ambiguous.

  - question: "The gene Concordance Factor (gCF) measures:"
    options:
      - text: The proportion of gene trees containing a specific branch
        correct: true
      - text: The proportion of informative sites supporting that branch
        correct: false
      - text: The percentage of bootstrap trees that contain that branch
        correct: false
      - text: The posterior probability of a branch across the MCMC chain
        correct: false
    explanation: >
      gCF counts how many individual gene trees (out of all gene trees
      analyzed) contain the branch of interest in the reference tree.
      It directly measures gene tree concordance, not site-level support.

  - question: "A site Concordance Factor (sCF) below 40% suggests:"
    options:
      - text: Weak support or substantial conflict across sites in data
        correct: true
      - text: Strong support — most sites agree with that branch here
        correct: false
      - text: The branch is perfectly resolved with no gene tree conflict
        correct: false
      - text: The branch should be collapsed into a polytomy immediately
        correct: false
    explanation: >
      sCF < 40% means fewer than 40% of informative sites support
      the branch — indicating weak signal, high homoplasy, or gene
      tree discordance. Values above 70% indicate strong concordance.

  - question: Why should multiple support metrics always be compared?
    options:
      - text: Each metric has different assumptions and can be misleading alone
        correct: true
      - text: Using one metric is always sufficient if it exceeds 95% value
        correct: false
      - text: Different software packages cannot compute the same metric here
        correct: false
      - text: Multiple metrics always give conflicting results by definition
        correct: false
    explanation: >
      Each metric has pitfalls — parametric supports assume the model
      is correct; PPs can be inflated; BPs can be conservative; CFs
      capture discordance others miss. Agreement across metrics is
      the best evidence for reliable branch support.

  - question: Which support metric is specifically designed to handle large trees with rogue taxa better than standard BP?
    options:
      - text: TBE — Transfer Bootstrap Expectation with gradual distances
        correct: true
      - text: aLRT — approximate Likelihood Ratio Test around each branch
        correct: false
      - text: PP — Posterior Probability from Bayesian MCMC sampling here
        correct: false
      - text: gCF — gene Concordance Factor across individual gene trees
        correct: false
    explanation: >
      TBE was specifically introduced to address the problem of standard
      BP performing poorly on large trees — one rogue taxon no longer
      collapses the entire branch score to zero as it does in standard BP.


fill_in_blank:
  - question: >
      Phylogenetic trees are not facts — they are ___ about evolutionary
      relationships. Support metrics tell us how ___ we can be in each branch.
    answers:
      - "hypotheses"
      - "confident"

  - question: >
      In non-parametric bootstrap, n columns are sampled ___ replacement
      to create a new alignment of the same ___. The BP is the ___ of
      replicates containing a given branch.
    answers:
      - "with"
      - "length"
      - "percentage"

  - question: >
      Bootstrap proportion (BP) measures the ___ of the signal, NOT
      the ___ that a branch is correct.
    answers:
      - "robustness"
      - "probability"

  - question: >
      Parametric bootstrap simulates alignments using a ___ and ___ fitted
      to the real data. If the model is ___, support values will be biased.
    answers:
      - "substitution model"
      - "tree"
      - "wrong (misspecified)"

  - question: >
      TBE was introduced because standard BP scores a branch as ___ if
      even one taxon is misplaced. TBE uses a gradual ___ distance to
      give partial credit instead.
    answers:
      - "absent"
      - "transfer"

  - question: >
      Jackknife deletes ___ % of columns ___ replacement per replicate.
      Bootstrap resamples ___ columns ___ replacement.
    answers:
      - "50"
      - "without"
      - "n"
      - "with"

  - question: >
      aLRT support = 2(L1 − ___). L1 is the likelihood of the ___ tree.
      L2 is the likelihood of the second-best ___ rearrangement around
      that branch.
    answers:
      - "L2"
      - "best (current)"
      - "NNI"

  - question: >
      Posterior Probabilities range from ___ to ___. A PP of 0.95 means
      the clade appeared in ___% of MCMC sampled trees. PPs tend to be
      ___ than bootstrap proportions.
    answers:
      - "0"
      - "1"
      - "95"
      - "higher"

  - question: >
      ___ CF measures the proportion of gene trees supporting a branch.
      ___ CF measures the proportion of informative sites supporting it.
      Values above ___% indicate strong concordance.
    answers:
      - "g (gene)"
      - "s (site)"
      - "70"

  - question: >
      A gCF or sCF below ___% suggests weak support or substantial ___
      across genes or sites. A value of 40–70% indicates ___ support
      with possible discordance.
    answers:
      - "40"
      - "conflict (discordance)"
      - "moderate"
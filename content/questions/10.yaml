# LESSON 10 — Support Metrics

oral:
  - q: >
      What does non-parametric bootstrapping measure in phylogenetics?
      Describe the procedure step by step and explain what the bootstrap
      proportion (BP) actually represents.
    a: |
      Non-parametric bootstrapping (Felsenstein 1985) measures the robustness
      of a phylogenetic inference to random resampling of the alignment columns.
      It does NOT measure the probability that a branch is correct — it measures
      the consistency of the phylogenetic signal across subsets of the data.
      Procedure:
      1. Start with an alignment of length n columns.
      2. Generate a bootstrapped alignment: randomly sample n columns WITH
         REPLACEMENT from the original alignment (some columns appear multiple
         times, others not at all). This produces a new alignment of the same
         length but different composition.
      3. Infer a tree from the bootstrapped alignment using the same method
         (ML, parsimony, NJ) as the original analysis.
      4. Repeat steps 2–3 many times (typically 100–1,000 replicates), storing
         all bootstrap trees.
      5. For each branch in the reference tree (usually the ML best tree or
         the majority-rule consensus), count the percentage of bootstrap trees
         containing that same bipartition. This is the bootstrap proportion (BP).
      What BP represents: the fraction of data-resampling replicates that
      recover a given clade. High BP (e.g. >95%) means the signal supporting
      that clade is robust to data sampling — removing and replacing random
      columns repeatedly still recovers it. Low BP means the signal is fragile
      and sensitive to which sites happen to be sampled.
      BP is NOT a posterior probability: it does not represent P(clade is correct).
      It reflects data robustness, not phylogenetic accuracy.

  - q: >
      What is Transfer Bootstrap Expectation (TBE) and why was it introduced?
      How does it differ conceptually from standard Felsenstein bootstrap?
    a: |
      TBE (Lemoine et al. 2018) was introduced because standard non-parametric
      bootstrap (Felsenstein BP) systematically underestimates support at deep
      branches in large datasets with rogue taxa.
      The problem with Felsenstein BP at scale:
      Standard BP uses binary scoring — a clade is either PRESENT or ABSENT
      in a bootstrap tree. In a tree with 1,000 tips, if 999 taxa are placed
      correctly but one rogue taxon jumps to the wrong position in a replicate,
      the entire branch is scored as ABSENT despite being nearly correct.
      With many rogue taxa, deep branches can score near 0% BP even when
      strongly supported — a severe underestimation at scale.
      TBE solution — the transfer distance:
      For each reference clade R in the best tree, TBE finds the closest
      matching bipartition B in each bootstrap tree by computing the transfer
      distance: the minimum number of taxa that need to move from one side of
      B to the other to match R exactly. Then:
      Transfer index = 1 − (transfer distance / (size of smaller side of R))
      A perfect match gives transfer index = 1; a complete mismatch = 0.
      TBE averages transfer indices across all bootstrap replicates, giving
      a continuous score that rewards partial support — even if a clade is
      not exactly present, near-matches contribute positively.
      Key difference from Felsenstein BP: BP is binary (present/absent per
      replicate); TBE is continuous (partial credit for near-correct clades).
      TBE is more informative for large trees and robust to rogue taxa.

  - q: >
      Compare non-parametric jackknife and non-parametric bootstrap.
      How do they differ in resampling strategy and what is the typical
      deletion proportion used in phylogenetics?
    a: |
      Both are resampling methods that assess branch support by generating
      alternative alignments and inferring trees from them, then counting how
      often a given branch is recovered.
      Non-parametric bootstrap (Felsenstein 1985):
      — Resamples WITH REPLACEMENT: n columns sampled from n original columns.
        Some columns appear multiple times; others are absent.
      — Produces an alignment of the SAME LENGTH as the original.
      — Each column has a probability 1/n of being selected each draw.
      Non-parametric jackknife:
      — Resamples WITHOUT REPLACEMENT: a fixed proportion of columns is
        DELETED and the rest retained.
      — Produces an alignment SHORTER than the original.
      — Typical deletion: 50% of sites are removed per replicate (as
        recommended by Felsenstein 1985), equivalent to drawing n/2 sites
        without replacement from an alignment of length n.
      — No column appears more than once in a given replicate.
      The resulting jackknife proportion (JF) is computed identically to BP:
      the percentage of jackknifed trees containing a given bipartition.
      Key practical difference: bootstrap produces same-length alignments
      (information density unchanged); jackknife produces shorter alignments
      (less total signal per replicate). In practice, jackknife and bootstrap
      values are highly correlated for well-supported branches. Jackknife is
      less commonly used in modern phylogenomics but remains theoretically
      valid and occasionally preferred for very large alignments where 50%
      deletion still leaves ample signal.

  - q: >
      What is the approximate Likelihood Ratio Test (aLRT) for branch support?
      Derive its logic from the standard LRT and explain its key approximation
      and limitation.
    a: |
      Standard LRT: compares two nested models. For branch support, compare:
      H1 (alternative): the tree with the branch of interest present.
      H0 (null): the same tree with that branch collapsed to zero length
        (removing it as a bipartition).
      The test statistic 2(lnL_H1 − lnL_H0) follows approximately a chi-squared
      distribution. If large, the branch significantly improves fit over a
      collapsed version.
      aLRT approximation (Anisimova & Gascuel 2006): instead of collapsing
      the branch (H0), approximate L_H0 using L_2 — the log-likelihood of the
      SECOND BEST NNI rearrangement around the branch of interest.
      Test statistic: aLRT = 2(lnL_best − lnL_second-best NNI)
      Why L_2? Optimizing a fully collapsed model requires a separate analysis.
      NNI rearrangements around the branch change only the four adjacent
      subtrees, keeping all other parameters fixed at their ML values. This
      makes aLRT extremely fast — only four adjacent branches need re-evaluation.
      The aLRT score can be converted to a p-value (chi-squared with 1 df)
      or left as a raw statistic; high values indicate the focal topology is
      significantly better than the best NNI alternative.
      Key limitation: aLRT is local — it only compares the branch against its
      immediate NNI alternatives. It misses distant alternative topologies
      that might have higher likelihood but require larger rearrangements (SPR
      or TBR moves). If the ML tree is itself in a poor local optimum, aLRT
      can give high support for wrong branches.

  - q: >
      What are gene concordance factors (gCF) and site concordance factors
      (sCF)? How do they complement bootstrap support, and what does a
      high bootstrap / low concordance combination indicate?
    a: |
      Concordance Factors (CFs) quantify how consistently individual genes or
      sites support each branch in a reference species tree, independently of
      the bootstrap framework.
      Gene Concordance Factor (gCF): the proportion of gene trees (from
      individual gene-by-gene analyses) that contain a specific branch or
      split present in the reference species tree. A gCF of 0.70 means 70%
      of gene trees support that branch. Requires individual gene trees.
      Site Concordance Factor (sCF): the proportion of parsimony-informative
      sites in the alignment that support a given branch. Rather than using
      all sites, a random quartet of taxa is drawn around each internal branch,
      and the proportion of informative sites supporting the focal quartet
      topology vs the two alternatives is computed. sCF does not require
      individual gene trees.
      How they complement bootstrap:
      Bootstrap measures robustness to resampling of the full dataset — it
      assesses whether the signal, whatever its source, is consistently sampled.
      CFs measure the fraction of independent loci or sites that actually
      support a branch — they assess biological consistency.
      High bootstrap / low gCF: the branch is consistently recovered by
      resampling the concatenated data, but most individual gene trees do NOT
      support it. This is the classic signature of ILS (Incomplete Lineage
      Sorting) or gene tree conflict — concatenation statistically amplifies
      a minority signal to appear strongly supported. It flags branches where
      the species tree may be biologically contentious despite apparent
      statistical confidence. This combination is a major warning sign that
      the inferred relationship may not reflect the true evolutionary history.


mcq:
  - question: >
      Non-parametric bootstrapping in phylogenetics samples alignment
      columns WITH replacement. The consequence is that:
    options:
      - text: Each bootstrap replicate has fewer columns than the original
        correct: false
      - text: Some columns appear multiple times and others not at all in
          each bootstrapped alignment, but the total length remains n
        correct: true
      - text: All columns are sampled exactly once per replicate
        correct: false
      - text: Bootstrap replicates include columns from other alignments
        correct: false
    explanation: |
      Sampling with replacement from n columns produces an alignment of the
      same length n, but the composition differs: by random chance, some
      columns are drawn multiple times (up-weighting their signal) and others
      are omitted (down-weighting or eliminating their signal). This random
      variation in column composition between replicates is what makes the
      bootstrap a test of signal robustness — if a branch disappears when
      some columns are reweighted, its signal is fragile.

  - question: >
      A bootstrap proportion of 95% means:
    options:
      - text: There is a 95% probability that the branch is correct
        correct: false
      - text: The branch was recovered in 95% of bootstrap replicate trees,
          indicating the signal supporting it is robust to data resampling
        correct: true
      - text: The branch has a posterior probability of 0.95
        correct: false
      - text: 95% of taxa in the dataset support the branch
        correct: false
    explanation: |
      Bootstrap proportions are frequently misinterpreted as probabilities of
      correctness — they are not. A BP of 95% means that when the alignment
      columns are randomly resampled with replacement 100 (or more) times,
      95 of those resampled datasets recover the same clade in their inferred
      tree. It reflects signal robustness, not phylogenetic accuracy. A branch
      can have BP = 100% and still be wrong if the data contain a systematic
      bias (e.g. long branch attraction, compositional heterogeneity).

  - question: >
      Felsenstein bootstrap underestimates support at deep branches in very
      large trees primarily because:
    options:
      - text: It uses fewer replicates for large datasets
        correct: false
      - text: It scores each clade as entirely present or absent — one rogue
          taxon misplaced makes the entire deep branch count as absent,
          even if all other taxa are correctly placed
        correct: true
      - text: Deep branches have shorter branch lengths and less signal
        correct: false
      - text: Bootstrap cannot handle alignments with missing data
        correct: false
    explanation: |
      The binary scoring of standard BP is its critical weakness at scale.
      For a clade of 500 taxa, if 499 are placed correctly but 1 rogue taxon
      moves in a replicate, the entire clade scores as ABSENT despite being
      99.8% correct. With many rogue taxa in large datasets, deep branches
      can score near 0% BP even when genuinely supported. TBE addresses this
      by using transfer distance to give partial credit for near-correct clades.

  - question: >
      TBE (Transfer Bootstrap Expectation) improves upon Felsenstein BP by:
    options:
      - text: Using more bootstrap replicates
        correct: false
      - text: Replacing binary present/absent scoring with a continuous
          transfer index that rewards near-correct bipartitions based on
          how few taxa need to move to match the reference clade
        correct: true
      - text: Applying a parametric model to simulate bootstrap replicates
        correct: false
      - text: Using amino acid rather than nucleotide alignments
        correct: false
    explanation: |
      TBE computes the minimum transfer distance between each reference clade
      R and the closest bipartition in each bootstrap tree — the minimum number
      of taxa that must be moved to match R exactly. The transfer index =
      1 − (transfer distance / smaller-side size). This gives partial credit:
      a nearly correct bipartition (transfer distance = 1) scores nearly 1,
      not 0 as in Felsenstein BP. TBE is more informative for deep branches
      in large datasets with rogue taxa.

  - question: >
      The key difference between the non-parametric jackknife and the
      non-parametric bootstrap is:
    options:
      - text: Jackknife uses parametric simulation; bootstrap uses resampling
        correct: false
      - text: Jackknife deletes a fixed proportion of columns WITHOUT
          replacement (shorter alignment per replicate); bootstrap resamples
          WITH replacement (same length per replicate)
        correct: true
      - text: Jackknife produces rooted trees; bootstrap produces unrooted trees
        correct: false
      - text: Bootstrap is applicable only to ML; jackknife only to parsimony
        correct: false
    explanation: |
      Jackknife: sample WITHOUT replacement, removing a fixed fraction (typically
      50%) of columns. Each column appears at most once; the result is a shorter
      alignment. Bootstrap: sample WITH replacement; each column can appear
      multiple times; the result is the same length as the original. Both
      produce support proportions by counting how often each branch appears
      across replicates. In practice they give similar results for well-supported
      branches; jackknife is less commonly used today.

  - question: >
      Parametric bootstrapping differs from non-parametric bootstrapping in that:
    options:
      - text: It resamples columns without replacement
        correct: false
      - text: It simulates new alignments from the estimated model and ML
          tree rather than resampling observed columns, so support values
          depend on whether the model is correctly specified
        correct: true
      - text: It always gives higher support values than non-parametric bootstrap
        correct: false
      - text: It requires Bayesian inference rather than ML
        correct: false
    explanation: |
      Parametric bootstrap: (1) estimate the substitution model and ML tree
      from the real alignment; (2) simulate new alignments from that model
      and tree; (3) infer trees from each simulated alignment; (4) count
      branch frequencies. The key danger: if the model is misspecified —
      e.g. assumes rate homogeneity when it does not hold — simulated
      alignments do not reflect the true data-generating process, and support
      values are biased toward the assumed model. Non-parametric bootstrap
      resamples real data and is model-free in the resampling step.

  - question: >
      The aLRT approximates the null hypothesis log-likelihood L_0 using:
    options:
      - text: The log-likelihood of the tree with the branch collapsed to zero
        correct: false
      - text: The log-likelihood of the second-best NNI rearrangement around
          the branch of interest, L_2
        correct: true
      - text: The log-likelihood averaged across all bootstrap replicates
        correct: false
      - text: The prior probability of the branch length
        correct: false
    explanation: |
      The full LRT would require optimizing the tree with the branch collapsed
      (H0) — a separate computationally expensive analysis. aLRT approximates
      L_0 with L_2, the log-likelihood of the second-best NNI configuration
      around that branch. Since NNI only moves the four adjacent subtrees and
      keeps all other parameters fixed, it is computed extremely quickly.
      The statistic 2(L_best − L_2) approximates the LRT statistic. The
      limitation is that L_2 only considers local rearrangements — distant
      but better topologies are not considered.

  - question: >
      A branch shows bootstrap = 98% but gCF = 22%. The most likely
      biological interpretation is:
    options:
      - text: The branch is definitively correct and strongly supported
        correct: false
      - text: Gene tree conflict due to ILS or hybridization — concatenation
          amplifies a minority signal across genes to appear highly supported,
          but most individual gene trees disagree
        correct: true
      - text: The substitution model is misspecified
        correct: false
      - text: The bootstrap replicates used insufficient columns
        correct: false
    explanation: |
      High bootstrap / low gCF is the canonical signature of gene tree
      discordance driven by ILS or reticulate evolution. Bootstrap measures
      signal robustness in the concatenated matrix — even a minority gene
      signal, if consistent, will be confidently recovered by resampling.
      gCF = 22% means only 22% of individual gene trees support this branch —
      78% support alternative relationships. This branch may be statistically
      robust in the supermatrix but biologically contentious. It is a warning
      that coalescent-based methods should be applied to test whether the
      concatenated tree reflects the true species history.

  - question: >
      Site concordance factor (sCF) differs from gCF in that:
    options:
      - text: sCF uses gene trees; gCF uses individual alignment sites
        correct: false
      - text: sCF uses the proportion of informative sites supporting a
          branch without requiring individual gene trees; gCF uses the
          proportion of gene trees containing the branch
        correct: true
      - text: sCF is computed only for Bayesian trees; gCF only for ML trees
        correct: false
      - text: sCF and gCF are identical metrics computed at different scales
        correct: false
    explanation: |
      gCF requires inferring individual gene trees first, then comparing them
      to the reference species tree — computationally expensive and dependent
      on gene tree accuracy. sCF works directly from the alignment: for each
      internal branch, a random quartet of taxa is drawn, and the proportion
      of parsimony-informative sites supporting the focal quartet topology vs
      the two alternatives is computed. sCF requires no gene trees and is
      therefore computationally lighter, though it measures a different thing:
      site-level rather than gene-level concordance.

  - question: >
      Posterior probabilities (PPs) compared to non-parametric bootstrap
      proportions (BPs) tend to be:
    options:
      - text: Always lower, because BI is more conservative
        correct: false
      - text: Higher, because PPs incorporate prior information and integrate
          over model uncertainty, but are sensitive to prior choice and
          model misspecification
        correct: true
      - text: Identical, because both measure the same quantity
        correct: false
      - text: Higher only when the dataset is small
        correct: false
    explanation: |
      PPs are typically higher than BPs for the same branch and dataset.
      This is because PPs integrate over all model parameter uncertainty
      (branch lengths, substitution rates) rather than treating them as fixed,
      giving a fuller accounting of what the data support. However, PPs are
      sensitive to prior choice (e.g. priors on branch lengths can inflate
      support for short branches) and to model misspecification. A poorly
      fitting model can produce PPs near 1.0 for wrong branches. The two
      metrics are philosophically different and should both be reported where
      possible.


fill_in_blank:
  - question: >
      Non-parametric bootstrapping samples _______________ columns with
      _______________ to produce a replicate alignment of the _______________ 
      length. The process is repeated _______________  times and the bootstrap
      proportion equals the percentage of replicates _______________ the branch.
    answers:
      - "n"
      - "replacement"
      - "same"
      - "100–1000 (many)"
      - "containing (recovering)"

  - question: >
      Bootstrap proportion does NOT represent the probability that a branch
      is _______________. It measures robustness of the phylogenetic _______________
      to random _______________ of the alignment data.
    answers:
      - "correct"
      - "signal"
      - "resampling (sampling)"

  - question: >
      TBE was introduced because Felsenstein BP uses _______________ scoring
      (a clade is either present or absent), which causes _______________
      of support at deep branches in large trees when _______________ taxa
      are present. TBE instead uses a continuous _______________ index.
    answers:
      - "binary"
      - "underestimation"
      - "rogue"
      - "transfer"

  - question: >
      The non-parametric jackknife deletes a fixed proportion (typically
      _______________%) of alignment columns _______________ replacement,
      producing a _______________ alignment per replicate. The result is
      qualitatively similar to the bootstrap but systematically produces
      _______________ alignments.
    answers:
      - "50"
      - "without"
      - "shorter"
      - "shorter"

  - question: >
      Parametric bootstrap simulates new alignments from the _______________
      model and _______________ tree estimated from the real data. Its key
      risk is that if the model is _______________, the simulated data do
      not reflect reality and support values become _______________.
    answers:
      - "substitution"
      - "ML (maximum likelihood)"
      - "misspecified"
      - "biased"

  - question: >
      The aLRT statistic is computed as 2(_______________ − _______________),
      where L_2 is the log-likelihood of the _______________ NNI rearrangement
      around the branch. Its main limitation is that it only evaluates
      _______________ rearrangements and may miss better _______________ topologies.
    answers:
      - "lnL_best (best ML tree)"
      - "lnL_2 (second-best NNI)"
      - "second-best"
      - "local (NNI)"
      - "distant"

  - question: >
      gCF is the proportion of _______________ trees containing a given branch.
      sCF is the proportion of _______________ sites supporting a branch.
      A high bootstrap combined with low gCF is the signature of _______________
      driven by _______________ or hybridization.
    answers:
      - "gene"
      - "parsimony-informative (concordant)"
      - "gene tree conflict (discordance)"
      - "ILS (incomplete lineage sorting)"

  - question: >
      Posterior probabilities (PPs) tend to be _______________ than bootstrap
      proportions. They are computed as the _______________ of a clade in the
      post-burn-in MCMC sample. They are sensitive to _______________ choice
      and model _______________, which can cause inflation of support.
    answers:
      - "higher"
      - "frequency (proportion)"
      - "prior"
      - "misspecification"